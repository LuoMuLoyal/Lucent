allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - nodemailer@10.0.8

overrides:
  stack-trace: 0.0.10
  find-my-way: 9.6.0
  # 钉死单一 fastify 版本：依赖树里出现第二份副本会让 FastifyInstance 变成两个不同的
  # 名义类型，typecheck 报 "incompatible between these types"（历史上由
  # @adminjs/fastify 的陈旧解析引入，该依赖已随 AdminJS 退役移除）。
  fastify: 5.12.5
