info:
  name: Get Today page suggestion cards
  type: http
  seq: 1
  tags:
    - Today_Suggestion

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/today/suggestions'
  headers:
    - name: accept-language
      value: ''
  params:
    - name: date
      value: ''
      type: query
      description: Target date (YYYY-MM-DD). Defaults to today.
      disabled: true
    - name: excludeIds
      value: '[]'
      type: query
      description: Suggestion IDs the user has dismissed.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

