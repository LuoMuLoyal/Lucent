info:
  name: Get authenticated user settings
  type: http
  seq: 1
  tags:
    - User_Settings

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/settings'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Authenticated user settings.
    request:
      url: '{{baseUrl}}/api/v1/user/settings'
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "aiSummariesEnabled": false,
            "dataSharingConsent": false,
            "assistantEnabled": false,
            "assistantMemoryEnabled": false,
            "assistantAgentMode": "default",
            "waterTargetCount": 0,
            "assistantContext": {
              "healthProfile": false,
              "dailyRecords": false,
              "sleepRecords": false,
              "currentMedicines": false
            },
            "updatedAt": "",
            "passwordReauthenticationRequired": false
          }
