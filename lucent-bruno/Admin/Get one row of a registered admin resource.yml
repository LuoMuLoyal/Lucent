info:
  name: Get one row of a registered admin resource
  type: http
  seq: 25
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/data/:resource/:id"
  params:
    - name: resource
      value: ""
      type: path
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Resource row.
    request:
      url: "{{baseUrl}}/api/v1/admin/data/:resource/:id"
      method: GET
      params:
        - name: resource
          value: ""
          type: path
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "usr_9f2c1e4a7b8d4c6e",
            "email": "a@example.com"
          }
  - name: 404 Response
    description: Unknown resource key or row not found.
    request:
      url: "{{baseUrl}}/api/v1/admin/data/:resource/:id"
      method: GET
      params:
        - name: resource
          value: ""
          type: path
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
