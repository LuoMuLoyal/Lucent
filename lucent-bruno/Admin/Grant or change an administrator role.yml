info:
  name: Grant or change an administrator role
  type: http
  seq: 12
  tags:
    - Admin

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/admins/:userId"
  params:
    - name: userId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "role": "SUPER_ADMIN"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Updated administrator grant.
    request:
      url: "{{baseUrl}}/api/v1/admin/admins/:userId"
      method: PUT
      params:
        - name: userId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "role": "SUPER_ADMIN"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userId": "",
            "email": "",
            "nickname": "",
            "userStatus": "active",
            "role": "SUPER_ADMIN",
            "createdAt": "",
            "updatedAt": ""
          }
  - name: 403 Response
    description: Attempting to change the caller's own role.
    request:
      url: "{{baseUrl}}/api/v1/admin/admins/:userId"
      method: PUT
      params:
        - name: userId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "role": "SUPER_ADMIN"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
