info:
  name: List user account summaries
  type: http
  seq: 4
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/users"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "25"
      type: query
    - name: q
      value: ""
      type: query
      disabled: true
    - name: status
      value: active
      type: query
      disabled: true
    - name: status
      value: suspended
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Paginated user account summaries.
    request:
      url: "{{baseUrl}}/api/v1/admin/users"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "25"
          type: query
        - name: q
          value: ""
          type: query
          disabled: true
        - name: status
          value: active
          type: query
          disabled: true
        - name: status
          value: suspended
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "email": "",
                "nickname": "",
                "status": "active",
                "isEmailVerified": false,
                "createdAt": "",
                "lastLoginAt": "",
                "adminRole": "SUPER_ADMIN"
              }
            ],
            "total": 0,
            "page": 0,
            "limit": 0
          }
