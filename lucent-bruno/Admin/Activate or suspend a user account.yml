info:
  name: Activate or suspend a user account
  type: http
  seq: 8
  tags:
    - Admin

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/admin/users/:id/status"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Updated user account summary.
    request:
      url: "{{baseUrl}}/api/v1/admin/users/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "status": "active"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "email": "",
            "nickname": "",
            "status": "active",
            "isEmailVerified": false,
            "createdAt": "",
            "lastLoginAt": "",
            "adminRole": "SUPER_ADMIN"
          }
  - name: 403 Response
    description: Target is the caller or a super administrator.
    request:
      url: "{{baseUrl}}/api/v1/admin/users/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "status": "active"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
  - name: 404 Response
    description: User not found.
    request:
      url: "{{baseUrl}}/api/v1/admin/users/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "status": "active"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
