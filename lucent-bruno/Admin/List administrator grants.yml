        data: |-
          {
            "items": [
              {
                "userId": "",
                "email": "",
                "nickname": "",
                "userStatus": "active",
                "role": "SUPER_ADMIN",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "total": 0
          }
