info:
  name: Revoke one of a user's sessions
  type: http
  seq: 9
  tags:
    - Admin

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/admin/users/:id/sessions/:sessionId"
  params:
    - name: id
      value: ""
      type: path
    - name: sessionId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Session revoked.
    request:
      url: "{{baseUrl}}/api/v1/admin/users/:id/sessions/:sessionId"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
        - name: sessionId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Session not found for this user.
    request:
      url: "{{baseUrl}}/api/v1/admin/users/:id/sessions/:sessionId"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
        - name: sessionId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
