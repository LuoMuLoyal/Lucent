info:
  name: Set initial password for OAuth-only account using email verification
  type: http
  seq: 5
  tags:
    - Account

http:
  method: POST
  url: '{{baseUrl}}/api/v1/account/set-password'
  body:
    type: json
    data: |-
      {
        "code": "",
        "password": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Password set.
    request:
      url: '{{baseUrl}}/api/v1/account/set-password'
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "password": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ''
  - name: 400 Response
    description: Verification code expired or does not match, or target email is missing
    request:
      url: '{{baseUrl}}/api/v1/account/set-password'
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
  - name: 404 Response
    description: Account not found
    request:
      url: '{{baseUrl}}/api/v1/account/set-password'
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "password": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
  - name: 409 Response
    description: Password already set or email already in use
    request:
      url: '{{baseUrl}}/api/v1/account/set-password'
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "password": ""
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
