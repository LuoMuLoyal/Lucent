info:
  name: Get unread notification count
  type: http
  seq: 3
  tags:
    - Notifications

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/notifications/unread-count'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Unread notification count.
    request:
      url: '{{baseUrl}}/api/v1/user/notifications/unread-count'
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 3
          }
