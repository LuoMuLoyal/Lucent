info:
  name: Get a notification detail
  type: http
  seq: 4
  tags:
    - Notifications

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/notifications/:id'
  params:
    - name: id
      value: ''
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Notification detail.
    request:
      url: '{{baseUrl}}/api/v1/user/notifications/:id'
      method: GET
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "type": "ai_today_summary",
            "title": "",
            "content": "",
            "action": "",
            "actionPayload": "",
            "isRead": false,
            "createdAt": "",
            "readAt": ""
          }
  - name: 404 Response
    description: Notification not found.
    request:
      url: '{{baseUrl}}/api/v1/user/notifications/:id'
      method: GET
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
