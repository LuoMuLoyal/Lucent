info:
  name: Run medicine risk check (static or LLM)
  type: http
  seq: 7
  tags:
    - Medicines

http:
  method: POST
  url: '{{baseUrl}}/api/v1/medicines/risk-check'
  body:
    type: json
    data: |-
      {
        "type": "static",
        "candidate": {
          "source": "drugbank",
          "id": "DB01050"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

