info:
  name: Structural candidates that do not use a given enzyme (not a prescription)
  type: http
  seq: 14
  tags:
    - Medicines

http:
  method: GET
  url: '{{baseUrl}}/api/v1/medicines/relations/substitutes'
  params:
    - name: drugbankId
      value: ''
      type: query
      description: DrugBank id being replaced
    - name: enzymeGene
      value: ''
      type: query
      description: Enzyme to avoid, e.g. CYP2C9
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Structural candidates with their shared target.
    request:
      url: '{{baseUrl}}/api/v1/medicines/relations/substitutes'
      method: GET
      params:
        - name: drugbankId
          value: ''
          type: query
          description: DrugBank id being replaced
        - name: enzymeGene
          value: ''
          type: query
          description: Enzyme to avoid, e.g. CYP2C9
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "candidates": [
              {
                "drugbankId": "",
                "name": "",
                "sharedTarget": ""
              }
            ]
          }
