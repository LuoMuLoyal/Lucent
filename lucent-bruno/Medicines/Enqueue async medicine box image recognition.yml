info:
  name: Enqueue async medicine box image recognition
  type: http
  seq: 9
  tags:
    - Medicines

http:
  method: POST
  url: '{{baseUrl}}/api/v1/medicines/recognize/async'
  body:
    type: json
    data: |-
      {
        "imageUrl": "https://cdn.lumos.example/medicines/amoxicillin-box.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Returns either a queued jobId or the synchronous recognition resource when the queue is unavailable.
    request:
      url: '{{baseUrl}}/api/v1/medicines/recognize/async'
      method: POST
      body:
        type: json
        data: |-
          {
            "imageUrl": "https://cdn.lumos.example/medicines/amoxicillin-box.jpg"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": "",
            "result": {
              "name": "",
              "approvalNumber": "",
              "specification": "",
              "manufacturer": ""
            }
          }
