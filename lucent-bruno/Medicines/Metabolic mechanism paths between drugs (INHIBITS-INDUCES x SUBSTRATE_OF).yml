info:
  name: Metabolic mechanism paths between drugs (INHIBITS/INDUCES x SUBSTRATE_OF)
  type: http
  seq: 11
  tags:
    - Medicines

http:
  method: GET
  url: '{{baseUrl}}/api/v1/medicines/relations/mechanism-paths'
  params:
    - name: drugbankIds
      value: ''
      type: query
      description: Comma-separated DrugBank ids (2-10)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Mechanism paths, or a status explaining why none.
    request:
      url: '{{baseUrl}}/api/v1/medicines/relations/mechanism-paths'
      method: GET
      params:
        - name: drugbankIds
          value: ''
          type: query
          description: Comma-separated DrugBank ids (2-10)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "paths": [
              {
                "enzymeGene": "",
                "enzymeName": "",
                "otherDrugId": "",
                "otherDrugName": "",
                "relation": ""
              }
            ]
          }
