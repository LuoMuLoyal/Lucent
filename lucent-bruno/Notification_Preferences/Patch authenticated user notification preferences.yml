info:
  name: Patch authenticated user notification preferences
  type: http
  seq: 2
  tags:
    - Notification_Preferences

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/notification-preferences'
  body:
    type: json
    data: |-
      {
        "isHealthAlertsEnabled": false,
        "isWeeklyInsightEnabled": false,
        "isWaterRemindersEnabled": false,
        "isSleepReminderEnabled": false,
        "sleepBedtimeMinutes": 0,
        "sleepWakeTimeMinutes": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Updated notification preferences.
    request:
      url: '{{baseUrl}}/api/v1/user/notification-preferences'
      method: PATCH
      body:
        type: json
        data: |-
          {
            "isHealthAlertsEnabled": false,
            "isWeeklyInsightEnabled": false,
            "isWaterRemindersEnabled": false,
            "isSleepReminderEnabled": false,
            "sleepBedtimeMinutes": 0,
            "sleepWakeTimeMinutes": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "isHealthAlertsEnabled": false,
            "isWeeklyInsightEnabled": false,
            "isWaterRemindersEnabled": false,
            "isSleepReminderEnabled": false,
            "sleepBedtimeMinutes": 0,
            "sleepWakeTimeMinutes": 0,
            "configured": false,
            "updatedAt": ""
          }
  - name: 400 Response
    description: Sleep time minutes out of range 0-1439 (VALIDATION_FAILED)
    request:
      url: '{{baseUrl}}/api/v1/user/notification-preferences'
      method: PATCH
      body:
        type: json
        data: |-
          {
            "isHealthAlertsEnabled": false,
            "isWeeklyInsightEnabled": false,
            "isWaterRemindersEnabled": false,
            "isSleepReminderEnabled": false,
            "sleepBedtimeMinutes": 0,
            "sleepWakeTimeMinutes": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
