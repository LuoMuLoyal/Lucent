info:
  name: List the symptom catalog (codes + labels)
  type: http
  seq: 4
  tags:
    - Daily_Records

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/daily-records/symptom-catalog'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: 'Static symptom catalog: stable codes in display order, labels localized via Accept-Language.'
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records/symptom-catalog'
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "code": "headache",
                "label": ""
              }
            ]
          }
