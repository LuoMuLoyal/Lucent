info:
  name: Get a daily record by id
  type: http
  seq: 7
  tags:
    - Daily_Records

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/daily-records/:id'
  params:
    - name: id
      value: ''
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The daily record.
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records/:id'
      method: GET
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "kind": "water",
            "healthEventId": "",
            "occurredAt": "",
            "occurredTime": "",
            "title": "",
