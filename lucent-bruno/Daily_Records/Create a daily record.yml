info:
  name: Create a daily record
  type: http
  seq: 2
  tags:
    - Daily_Records

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/daily-records'
  body:
    type: json
    data: |-
      {
        "kind": "vital",
        "occurredAt": "2026-06-04",
        "occurredTime": "08:30",
        "title": "Morning blood pressure",
        "value": "120/80",
        "unit": "mmHg",
        "note": "After waking up.",
        "source": "manual",
        "healthEventId": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
        "payload": {
          "vitalType": "bloodPressure",
          "value": 120,
          "unit": "mmHg",
          "secondaryValue": 80,
          "secondaryUnit": "mmHg"
        },
        "attachments": [
          {
            "kind": "image",
            "objectKey": "daily-records/user_1/2026-06-04/photo.jpg",
            "contentType": "image/jpeg"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: The created daily record.
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records'
      method: POST
      body:
        type: json
        data: |-
          {
            "kind": "vital",
