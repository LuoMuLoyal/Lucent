              "unit": "mmHg",
              "secondaryValue": 80,
              "secondaryUnit": "mmHg"
            },
            "attachments": [
              {
                "kind": "image",
                "objectKey": "daily-records/user_1/2026-06-04/photo.jpg",
                "contentType": "image/jpeg"
              }
            ]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
