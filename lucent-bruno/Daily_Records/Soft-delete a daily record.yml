info:
  name: Soft-delete a daily record
  type: http
  seq: 9
  tags:
    - Daily_Records

http:
  method: DELETE
  url: '{{baseUrl}}/api/v1/user/daily-records/:id'
  params:
    - name: id
      value: ''
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Daily record deleted.
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records/:id'
      method: DELETE
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ''
  - name: 403 Response
    description: Daily record is owned by another user
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records/:id'
      method: DELETE
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
  - name: 404 Response
    description: Daily record not found
    request:
      url: '{{baseUrl}}/api/v1/user/daily-records/:id'
      method: DELETE
      params:
        - name: id
          value: ''
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
