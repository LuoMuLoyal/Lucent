info:
  name: Get a specific legal document by type
  type: http
  seq: 2
  tags:
    - Legal_Documents

http:
  method: GET
  url: '{{baseUrl}}/api/v1/legal-documents/:docType'
  params:
    - name: docType
      value: ''
      type: path
    - name: lang
      value: zh
      type: query
      description: "Content language: 'zh' or 'en'. Default: 'zh'."
      disabled: true
    - name: lang
      value: en
      type: query
      description: "Content language: 'zh' or 'en'. Default: 'zh'."
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Legal document detail with Markdown content.
    request:
      url: '{{baseUrl}}/api/v1/legal-documents/:docType'
      method: GET
      params:
        - name: docType
          value: ''
          type: path
        - name: lang
          value: zh
          type: query
          description: "Content language: 'zh' or 'en'. Default: 'zh'."
          disabled: true
        - name: lang
          value: en
          type: query
          description: "Content language: 'zh' or 'en'. Default: 'zh'."
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "docType": "terms-of-service",
            "title": "",
            "content": "",
            "updatedAt": ""
          }
  - name: 404 Response
    description: Document type not found or inactive.
    request:
      url: '{{baseUrl}}/api/v1/legal-documents/:docType'
      method: GET
      params:
        - name: docType
          value: ''
          type: path
        - name: lang
          value: zh
          type: query
          description: "Content language: 'zh' or 'en'. Default: 'zh'."
          disabled: true
        - name: lang
          value: en
          type: query
          description: "Content language: 'zh' or 'en'. Default: 'zh'."
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
