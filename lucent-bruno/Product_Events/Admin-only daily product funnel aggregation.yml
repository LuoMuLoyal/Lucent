info:
  name: Admin-only daily product funnel aggregation
  type: http
  seq: 2
  tags:
    - Product_Events

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/product-events/funnel'
  params:
    - name: dateFrom
      value: ''
      type: query
      description: Window start (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
      disabled: true
    - name: dateTo
      value: ''
      type: query
      description: Window end (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Aggregated funnel counts for the requested window.
    request:
      url: '{{baseUrl}}/api/v1/user/product-events/funnel'
      method: GET
      params:
        - name: dateFrom
          value: ''
          type: query
          description: Window start (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
        - name: dateTo
          value: ''
          type: query
          description: Window end (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "daily": [
              {
                "date": "2026-01-15",
                "eventStarted": 120,
                "suggestionImpression": 340,
                "suggestionActioned": 210,
                "eventEndedOrOutcome": 95,
                "reviewOpened": 60
              }
            ],
            "optional": {
              "visitSummaryPreviewed": 40,
              "visitSummaryExported": 12,
              "visitSummaryShareCreated": 8,
              "visitSummaryShareOpened": 5
            },
            "totals": {
              "eventStarted": 120,
              "suggestionImpression": 340,
              "suggestionActioned": 210,
              "eventEndedOrOutcome": 95,
              "reviewOpened": 60
            },
            "window": {
              "dateFrom": "2026-01-01",
              "dateTo": "2026-01-15",
              "generatedAt": "2026-01-16T08:30:00.000Z",
              "detailsSuppressed": false
            }
          }
  - name: 400 Response
    description: Invalid funnel query window (dates or range).
    request:
      url: '{{baseUrl}}/api/v1/user/product-events/funnel'
      method: GET
      params:
        - name: dateFrom
          value: ''
          type: query
          description: Window start (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
        - name: dateTo
          value: ''
          type: query
          description: Window end (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
  - name: 401 Response
    description: Missing or invalid access token.
    request:
      url: '{{baseUrl}}/api/v1/user/product-events/funnel'
      method: GET
      params:
        - name: dateFrom
          value: ''
          type: query
          description: Window start (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
        - name: dateTo
          value: ''
          type: query
          description: Window end (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ''
  - name: 403 Response
    description: Authenticated user without an AdminUser role.
    request:
      url: '{{baseUrl}}/api/v1/user/product-events/funnel'
      method: GET
      params:
        - name: dateFrom
          value: ''
          type: query
          description: Window start (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
        - name: dateTo
          value: ''
          type: query
          description: Window end (inclusive), ISO 8601 date (YYYY-MM-DD) or datetime; the UTC calendar day is used.
          disabled: true
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ''

docs: 'Internal admin surface: a valid JWT must belong to a user with an AdminUser role; regular users get 403. Aggregates the core product loop per UTC calendar day — event started → suggestion impression/actioned → event ended/outcome → review opened — plus optional visit-summary events separately. Counts only: the response carries no health content, rule codes, user ids or per-user detail. Per-day details are suppressed below the small-sample threshold.'
