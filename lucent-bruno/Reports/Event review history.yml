info:
  name: Event review history
  type: http
  seq: 16
  tags:
    - Reports

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/reports/reviews'
  params:
    - name: status
      value: active
      type: query
      description: Filter events by status. No time range is required.
      disabled: true
    - name: status
      value: ended
      type: query
      description: Filter events by status. No time range is required.
      disabled: true
    - name: cursor
      value: ''
      type: query
      description: 'Opaque cursor for pagination: composite of the last item startedAt ISO 8601 value and id joined with "|", as returned by nextCursor. Must not be constructed by the client.'
      disabled: true
    - name: limit
      value: '1'
      type: query
      description: Page size (1-100).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: '{{baseUrl}}/api/v1/user/reports/reviews'
      method: GET
      params:
        - name: status
          value: active
          type: query
          description: Filter events by status. No time range is required.
          disabled: true
        - name: status
          value: ended
          type: query
          description: Filter events by status. No time range is required.
          disabled: true
        - name: cursor
          value: ''
          type: query
          description: 'Opaque cursor for pagination: composite of the last item startedAt ISO 8601 value and id joined with "|", as returned by nextCursor. Must not be constructed by the client.'
          disabled: true
        - name: limit
          value: '1'
          type: query
          description: Page size (1-100).
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "kind": "symptom",
                "title": "",
                "status": "active",
                "startedAt": "",
                "endedAt": "",
                "outcome": "improved",
                "currentMedicineIds": []
              }
            ],
            "total": 0,
            "nextCursor": ""
          }
