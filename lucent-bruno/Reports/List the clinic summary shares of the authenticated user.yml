info:
  name: List the clinic summary shares of the authenticated user
  type: http
  seq: 8
  tags:
    - Reports

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/shares'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The caller clinic-summary shares, newest first.
    request:
      url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/shares'
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "createdAt": "",
                "expiresAt": "",
                "revokedAt": "",
                "accessCount": 0,
                "firstAccessedAt": "",
                "lastAccessedAt": "",
                "scope": {
                  "eventId": "",
                  "dateFrom": "",
                  "dateTo": ""
                },
                "selectedFields": []
              }
            ]
          }
