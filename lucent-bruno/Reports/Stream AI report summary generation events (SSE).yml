info:
  name: Stream AI report summary generation events (SSE)
  type: http
  seq: 5
  tags:
    - Reports

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/reports/summary/generate/stream'
  body:
    type: json
    data: |-
      {
        "range": "last_7_days",
        "startDate": "",
        "endDate": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

