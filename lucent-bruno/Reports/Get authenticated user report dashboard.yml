info:
  name: Get authenticated user report dashboard
  type: http
  seq: 1
  tags:
    - Reports

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/reports/dashboard'
  params:
    - name: range
      value: last_7_days
      type: query
      description: Supported report aggregation range.
      disabled: true
    - name: range
      value: last_30_days
      type: query
      description: Supported report aggregation range.
      disabled: true
    - name: range
      value: custom
      type: query
      description: Supported report aggregation range.
      disabled: true
    - name: startDate
      value: ''
      type: query
      description: Required when range is "custom". ISO 8601 date string (YYYY-MM-DD).
      disabled: true
    - name: endDate
      value: ''
      type: query
      description: Required when range is "custom". ISO 8601 date string (YYYY-MM-DD).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Report dashboard with metric/trend/finding/pattern blocks.
    request:
      url: '{{baseUrl}}/api/v1/user/reports/dashboard'
