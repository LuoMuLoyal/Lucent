info:
  name: Access a shared clinic summary by token (no auth required)
  type: http
  seq: 9
  tags:
    - Reports

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/shared/:token'
  params:
    - name: token
      value: ''
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The shared clinic summary.
    request:
      url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/shared/:token'
      method: GET
      params:
        - name: token
          value: ''
          type: path
