info:
  name: Generate a de-identified clinic summary for sharing with a doctor
  type: http
  seq: 6
  tags:
    - Reports

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/preview'
  body:
    type: json
    data: |-
      {
        "eventId": "",
        "dateFrom": "",
        "dateTo": "",
        "selectedFields": [
          "event_overview"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: The de-identified clinic summary preview.
    request:
      url: '{{baseUrl}}/api/v1/user/reports/clinic-summary/preview'
