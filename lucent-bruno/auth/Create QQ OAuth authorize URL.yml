info:
  name: Create QQ OAuth authorize URL
  type: http
  seq: 12
  tags:
    - Auth

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/oauth/qq/authorize'
  body:
    type: json
    data: |-
      {
        "callbackUri": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OAuth authorize URL with state and expiry.
    request:
      url: '{{baseUrl}}/api/v1/auth/oauth/qq/authorize'
      method: POST
      body:
        type: json
        data: |-
          {
            "callbackUri": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "authorizeUrl": "https://open.weixin.qq.com/connect/qrconnect?appid=wx1234567890abcdef&redirect_uri=https%3A%2F%2Flumos.app%2Fauth%2Fcallback&response_type=code&scope=snsapi_login&state=xyz",
            "state": "st_5f2c9a1b7e4d4f8e9a0b",
            "expiresIn": 600,
            "callbackUri": ""
          }
  - name: 400 Response
    description: Invalid callback URI
    request:
      url: '{{baseUrl}}/api/v1/auth/oauth/qq/authorize'
      method: POST
      body:
        type: json
        data: |-
          {
            "callbackUri": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
