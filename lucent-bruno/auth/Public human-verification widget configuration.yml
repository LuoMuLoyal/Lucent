info:
  name: Public human-verification widget configuration
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: GET
  url: '{{baseUrl}}/api/v1/auth/captcha'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Whether the challenge is enforced and the public site key to render it with.
    request:
      url: '{{baseUrl}}/api/v1/auth/captcha'
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "enabled": false,
            "siteKey": "0x4AAAAAAA_example_site_key"
          }
