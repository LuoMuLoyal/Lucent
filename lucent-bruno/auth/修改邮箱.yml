info:
  name: 修改邮箱
  type: http
  seq: 9

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/auth/email'
  body:
    type: json
    data: |-
      {
        "newEmail": "newemail@example.com",
        "password": "Abc12345",
        "code": "123456"
      }
  headers:
    Authorization: 'Bearer {{accessToken}}'
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
