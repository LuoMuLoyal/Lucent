info:
  name: QQ OAuth callback login
  type: http
  seq: 13
  tags:
    - Auth

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/oauth/qq/callback'
  body:
    type: json
    data: |-
      {
        "code": "",
        "state": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Authenticated user with token pair.
    request:
      url: '{{baseUrl}}/api/v1/auth/oauth/qq/callback'
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "state": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user": {
              "id": "",
              "email": "",
              "nickname": "",
              "avatar": "",
              "isEmailVerified": false,
              "emailVerifiedAt": "",
              "createdAt": "",
              "updatedAt": ""
            },
            "tokens": {
              "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfMSJ9",
              "refreshToken": "rt_9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c",
              "expiresIn": 900
            }
          }
  - name: 400 Response
    description: Invalid OAuth state or missing/malformed callback credential
