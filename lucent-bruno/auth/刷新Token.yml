info:
  name: 刷新Token
  type: http
  seq: 5

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/refresh'
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
