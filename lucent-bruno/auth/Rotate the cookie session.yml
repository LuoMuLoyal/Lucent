info:
  name: Rotate the cookie session
  type: http
  seq: 22
  tags:
    - Auth

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/browser/refresh'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Rotated session; new tokens are set as HttpOnly cookies.
    request:
      url: '{{baseUrl}}/api/v1/auth/browser/refresh'
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user": {
              "id": "",
              "email": "",
              "nickname": "",
              "avatar": "",
              "isEmailVerified": false,
              "emailVerifiedAt": "",
              "createdAt": "",
              "updatedAt": ""
            },
            "expiresIn": 900
          }
  - name: 401 Response
    description: Refresh token missing, invalid, expired or already consumed
    request:
      url: '{{baseUrl}}/api/v1/auth/browser/refresh'
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
