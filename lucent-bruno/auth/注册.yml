info:
  name: 注册
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/register'
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": "",
        "code": "",
        "captchaToken": "",
        "nickname": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
