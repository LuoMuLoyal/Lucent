info:
  name: Logout (clears the cookie session)
  type: http
  seq: 23
  tags:
    - Auth

http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/browser/logout'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Logged out; cookies cleared.
    request:
      url: '{{baseUrl}}/api/v1/auth/browser/logout'
      method: POST
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ''
  - name: 401 Response
    description: Access token invalid or expired (sent as a cookie)
    request:
      url: '{{baseUrl}}/api/v1/auth/browser/logout'
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
