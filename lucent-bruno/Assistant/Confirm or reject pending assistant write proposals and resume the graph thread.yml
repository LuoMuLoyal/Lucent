info:
  name: Confirm or reject pending assistant write proposals and resume the graph thread
  type: http
  seq: 5
  tags:
    - Assistant

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/assistant/conversations/:conversationId/confirm'
  params:
    - name: conversationId
      value: ''
      type: path
  body:
    type: json
    data: |-
      {
        "proposalIds": [
          "prop_4f8a2c9e1d"
        ],
        "decision": "approved",
        "note": "已与医生确认。"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

