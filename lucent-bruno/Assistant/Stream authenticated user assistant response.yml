info:
  name: Stream authenticated user assistant response
  type: http
  seq: 10
  tags:
    - Assistant

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/assistant/messages/stream'
  body:
    type: json
    data: |-
      {
        "messages": [
          {
            "role": "user",
            "content": "我最近头痛，布洛芬一次应该吃多少？"
          }
        ],
        "conversationId": "conv_9f2c1e4a7b8d4c6e"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Server-Sent Events stream. Each event has an "event" field (chunk | result | error | done) and a JSON "data" field.
    request:
      url: '{{baseUrl}}/api/v1/user/assistant/messages/stream'
      method: POST
      body:
        type: json
        data: |-
          {
            "messages": [
              {
                "role": "user",
                "content": "我最近头痛，布洛芬一次应该吃多少？"
              }
            ],
            "conversationId": "conv_9f2c1e4a7b8d4c6e"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/event-stream
      body:
        type: text
        data: ''
