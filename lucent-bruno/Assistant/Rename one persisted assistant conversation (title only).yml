info:
  name: Rename one persisted assistant conversation (title only)
  type: http
  seq: 6
  tags:
    - Assistant

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/assistant/conversations/:conversationId'
  params:
    - name: conversationId
      value: ''
      type: path
  body:
    type: json
    data: |-
      {
        "title": "用药咨询"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The renamed conversation with its full message history.
    request:
      url: '{{baseUrl}}/api/v1/user/assistant/conversations/:conversationId'
      method: PATCH
      params:
        - name: conversationId
          value: ''
          type: path
      body:
        type: json
        data: |-
          {
            "title": "用药咨询"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "title": "",
            "status": "active",
            "messages": [
              {
                "role": "user",
                "content": "",
                "usedTools": [],
                "createdAt": ""
              }
            ],
            "lastMessageAt": "",
            "createdAt": "",
            "updatedAt": ""
          }
