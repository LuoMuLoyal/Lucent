info:
  name: Erase all persisted assistant memories for the user
  type: http
  seq: 8
  tags:
    - Assistant

http:
  method: DELETE
  url: '{{baseUrl}}/api/v1/user/assistant/memory'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Number of persisted assistant memory rows deleted.
    request:
      url: '{{baseUrl}}/api/v1/user/assistant/memory'
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cleared": 3
          }
