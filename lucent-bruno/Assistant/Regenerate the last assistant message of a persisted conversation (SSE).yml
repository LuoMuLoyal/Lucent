info:
  name: Regenerate the last assistant message of a persisted conversation (SSE)
  type: http
  seq: 11
  tags:
    - Assistant

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/assistant/conversations/:conversationId/regenerate'
  params:
    - name: conversationId
      value: ''
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Server-Sent Events stream. Each event has an "event" field (chunk | result | error | done) and a JSON "data" field.
    request:
      url: '{{baseUrl}}/api/v1/user/assistant/conversations/:conversationId/regenerate'
      method: POST
      params:
        - name: conversationId
          value: ''
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/event-stream
      body:
        type: text
        data: ''
