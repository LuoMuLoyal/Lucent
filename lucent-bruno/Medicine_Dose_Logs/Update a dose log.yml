info:
  name: Update a dose log
  type: http
  seq: 4
  tags:
    - Medicine_Dose_Logs

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/medicine-dose-logs/:id'
  params:
    - name: id
      value: ''
      type: path
  body:
    type: json
    data: |-
      {
        "status": "taken",
        "doseText": "",
        "note": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The updated dose log.
    request:
      url: '{{baseUrl}}/api/v1/user/medicine-dose-logs/:id'
      method: PATCH
      params:
        - name: id
          value: ''
          type: path
      body:
        type: json
        data: |-
          {
            "status": "taken",
            "doseText": "",
            "note": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "healthEventId": "",
            "currentMedicineId": "",
            "reminderId": "",
            "status": "taken",
            "scheduledFor": "",
            "scheduledTime": "",
            "doseText": "",
            "note": "",
            "source": "",
            "createdAt": "",
            "updatedAt": ""
          }
  - name: 404 Response
    description: Dose log not found (RESOURCE_NOT_FOUND)
    request:
