info:
  name: Create a medicine reminder schedule
  type: http
  seq: 2
  tags:
    - Medicine_Reminders

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/medicine-reminders'
  body:
    type: json
    data: |-
      {
        "currentMedicineId": "",
        "label": "",
        "scheduledHour": 0,
        "scheduledMinute": 0,
        "daysOfWeek": [],
        "startDate": "",
        "endDate": "",
        "isActive": false,
        "note": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: The created medicine reminder.
    request:
      url: '{{baseUrl}}/api/v1/user/medicine-reminders'
      method: POST
      body:
        type: json
        data: |-
          {
            "currentMedicineId": "",
            "label": "",
            "scheduledHour": 0,
            "scheduledMinute": 0,
            "daysOfWeek": [],
            "startDate": "",
            "endDate": "",
            "isActive": false,
            "note": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "currentMedicineId": "",
            "label": "",
            "scheduledHour": 0,
            "scheduledMinute": 0,
            "daysOfWeek": [],
            "startDate": "",
            "endDate": "",
            "isActive": false,
            "note": "",
            "createdAt": "",
            "updatedAt": ""
          }
