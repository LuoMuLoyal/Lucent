info:
  name: Update a medicine reminder schedule
  type: http
  seq: 3
  tags:
    - Medicine_Reminders

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/medicine-reminders/:id'
  params:
    - name: id
      value: ''
      type: path
  body:
    type: json
    data: |-
      {
        "currentMedicineId": "",
        "label": "",
        "scheduledHour": 0,
        "scheduledMinute": 0,
        "daysOfWeek": [],
        "startDate": "",
        "endDate": "",
        "isActive": false,
        "note": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

