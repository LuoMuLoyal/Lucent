  type: http
  seq: 4
  tags:
    - User_Health_Context

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/health-context/allergies/:id'
  params:
    - name: id
      value: ''
      type: path
      description: Allergy id
  body:
    type: json
    data: |-
      {
        "kind": "food",
        "label": "Peanut",
        "reaction": "Hives and swelling",
        "severity": "moderate",
        "note": "Avoid peanuts and peanut oil.",
        "recordedAt": "2026-06-04T08:30:00.000Z",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

