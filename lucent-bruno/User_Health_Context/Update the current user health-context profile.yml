info:
  name: Update the current user health-context profile
  type: http
  seq: 2
  tags:
    - User_Health_Context

http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/user/health-context/profile'
  body:
    type: json
    data: |-
      {
        "locale": "zh-CN",
        "timezone": "Asia/Shanghai",
        "unitSystem": "metric",
        "birthDate": "1990-05-20",
        "sexAtBirth": "female",
        "heightCm": 165,
        "activityLevel": "moderatelyActive",
        "dietaryPreferences": [
          "vegetarian",
          "lowSalt"
        ],
        "weightKg": 60,
        "onboardingCompleted": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

