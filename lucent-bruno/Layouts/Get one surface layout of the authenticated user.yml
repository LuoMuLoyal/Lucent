info:
  name: Get one surface layout of the authenticated user
  type: http
  seq: 2
  tags:
    - Layouts

http:
  method: GET
  url: '{{baseUrl}}/api/v1/layouts/:surface'
  params:
    - name: surface
      value: today
      type: path
      description: Surface identifier.
    - name: surface
      value: record
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: medicine
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: review
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: mine
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: tab
      type: path
      description: Surface identifier.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The stored layout for this surface.
    request:
      url: '{{baseUrl}}/api/v1/layouts/:surface'
      method: GET
      params:
        - name: surface
          value: today
          type: path
          description: Surface identifier.
        - name: surface
          value: record
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: medicine
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: review
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: mine
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: tab
          type: path
          description: Surface identifier.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "surface": "today",
            "version": 3,
            "schemaVersion": 1,
            "payload": {
              "placements": [
                {
                  "id": "summary.metrics",
                  "size": "wide"
                },
                {
                  "id": "water.trend",
                  "size": "compact"
                }
              ]
            },
            "updatedAt": "2026-10-30T12:00:00.000Z"
          }
  - name: 404 Response
    description: No layout stored for this surface (RESOURCE_NOT_FOUND)
    request:
      url: '{{baseUrl}}/api/v1/layouts/:surface'
      method: GET
      params:
        - name: surface
          value: today
          type: path
          description: Surface identifier.
        - name: surface
          value: record
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: medicine
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: review
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: mine
          type: path
          description: Surface identifier.
          disabled: true
        - name: surface
          value: tab
          type: path
          description: Surface identifier.
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
            "retryAfter": 60,
            "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
          }
