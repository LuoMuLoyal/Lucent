info:
  name: Create or replace one surface layout
  type: http
  seq: 3
  tags:
    - Layouts

http:
  method: PUT
  url: '{{baseUrl}}/api/v1/layouts/:surface'
  params:
    - name: surface
      value: today
      type: path
      description: Surface identifier.
    - name: surface
      value: record
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: medicine
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: review
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: mine
      type: path
      description: Surface identifier.
      disabled: true
    - name: surface
      value: tab
      type: path
      description: Surface identifier.
      disabled: true
  body:
    type: json
    data: |-
      {
        "ifVersion": 0,
        "schemaVersion": 0,
        "payload": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

