info:
  name: Stream an AI-composed A2UI surface for this screen
  type: http
  seq: 4
  tags:
    - Layouts

http:
  method: POST
  url: '{{baseUrl}}/api/v1/layouts/:surface/generate'
  params:
    - name: surface
      value: today
      type: path
      description: Surface to compose. The tab bar is not composable.
    - name: surface
      value: record
      type: path
      description: Surface to compose. The tab bar is not composable.
      disabled: true
    - name: surface
      value: medicine
      type: path
      description: Surface to compose. The tab bar is not composable.
      disabled: true
    - name: surface
      value: review
      type: path
      description: Surface to compose. The tab bar is not composable.
      disabled: true
    - name: surface
      value: mine
      type: path
      description: Surface to compose. The tab bar is not composable.
      disabled: true
  body:
    type: json
    data: |-
      {
        "prompt": "把每日饮水做成三张并排的小卡，再配一句这周的整体情况",
        "range": "7d"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

