info:
  name: List the user health event history
  type: http
  seq: 2
  tags:
    - Health_Events

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/health-events'
  params:
    - name: date
      value: ''
      type: query
      description: Calendar date in YYYY-MM-DD format.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The user health event history page.
    request:
      url: '{{baseUrl}}/api/v1/user/health-events'
      method: GET
      params:
        - name: date
          value: ''
          type: query
          description: Calendar date in YYYY-MM-DD format.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "kind": "symptom",
                "id": "",
                "title": "",
                "status": "active",
                "startedAt": "",
                "endedAt": "",
                "outcome": "improved",
                "reasonRecordId": "",
                "currentMedicineIds": [],
                "checkIn": {
                  "id": "",
                  "eventId": "",
                  "date": "",
                  "outcome": "improved",
                  "createdAt": "",
                  "updatedAt": ""
                },
                "coverage": {
                  "checkInCount": 0,
                  "firstCheckInDate": "",
                  "lastCheckInDate": ""
                }
              }
            ],
            "total": 0
          }
