info:
  name: End a health event with an explicit outcome
  type: http
  seq: 6
  tags:
    - Health_Events

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/health-events/:id/end'
  params:
    - name: id
      value: ''
      type: path
      description: Health event id.
  body:
    type: json
    data: |-
      {
        "outcome": "improved"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The ended health event.
    request:
      url: '{{baseUrl}}/api/v1/user/health-events/:id/end'
      method: POST
      params:
        - name: id
          value: ''
          type: path
          description: Health event id.
      body:
        type: json
        data: |-
          {
            "outcome": "improved"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "kind": "symptom",
            "id": "",
            "title": "",
            "status": "active",
            "startedAt": "",
            "endedAt": "",
