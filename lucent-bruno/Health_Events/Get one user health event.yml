info:
  name: Get one user health event
  type: http
  seq: 4
  tags:
    - Health_Events

http:
  method: GET
  url: '{{baseUrl}}/api/v1/user/health-events/:id'
  params:
    - name: id
      value: ''
      type: path
      description: Health event id.
    - name: date
      value: ''
      type: query
      description: Calendar date in YYYY-MM-DD format.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The health event.
    request:
      url: '{{baseUrl}}/api/v1/user/health-events/:id'
      method: GET
      params:
        - name: id
          value: ''
          type: path
          description: Health event id.
        - name: date
          value: ''
          type: query
          description: Calendar date in YYYY-MM-DD format.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "kind": "symptom",
            "id": "",
            "title": "",
