info:
  name: Upsert a user-confirmed daily event check-in
  type: http
  seq: 5
  tags:
    - Health_Events

http:
  method: PUT
  url: '{{baseUrl}}/api/v1/user/health-events/:id/check-ins/:date'
  params:
    - name: id
      value: ''
      type: path
      description: Health event id.
    - name: date
      value: ''
      type: path
      description: Calendar date in YYYY-MM-DD format.
  body:
    type: json
    data: |-
      {
        "outcome": "improved"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The updated health event.
    request:
      url: '{{baseUrl}}/api/v1/user/health-events/:id/check-ins/:date'
      method: PUT
      params:
        - name: id
          value: ''
          type: path
          description: Health event id.
        - name: date
          value: ''
          type: path
          description: Calendar date in YYYY-MM-DD format.
      body:
        type: json
        data: |-
          {
            "outcome": "improved"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "kind": "symptom",
            "id": "",
