info:
  name: Create a presigned upload URL for a file
  type: http
  seq: 1
  tags:
    - Files

http:
  method: POST
  url: '{{baseUrl}}/api/v1/user/files/upload'
  body:
    type: json
    data: |-
      {
        "contentType": "",
        "sizeBytes": 0,
        "fileName": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Presigned upload URL for the requested file.
    request:
      url: '{{baseUrl}}/api/v1/user/files/upload'
      method: POST
      body:
        type: json
        data: |-
          {
            "contentType": "",
            "sizeBytes": 0,
            "fileName": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "provider": "",
            "bucket": "",
            "objectKey": "",
            "uploadUrl": "",
            "headers": {},
            "publicUrl": "",
            "expiresAt": "",
            "maxSizeBytes": 0
          }
  - name: 400 Response
    description: Unsupported content type or file size above the limit.
    request:
      url: '{{baseUrl}}/api/v1/user/files/upload'
      method: POST
      body:
        type: json
        data: |-
          {
            "contentType": "",
            "sizeBytes": 0,
            "fileName": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "https://api.lumos.example/problems/resource-not-found",
            "title": "Resource not found",
            "detail": "The requested resource could not be found.",
            "code": "RESOURCE_NOT_FOUND",
            "errors": {},
            "retryable": false,
