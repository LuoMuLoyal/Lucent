# Redis Sentinel 配置参考（主站高可用）
#
# ⚠️ 这份文件**不会被直接挂进容器**。`compose.yaml` 的 `redis-sentinel` 服务
#    在容器内自行生成三份配置（端口 26379/26380/26381），原因是 Sentinel 会
#    持续重写自己的配置文件（记录已知 replica 与新 master）——挂载宿主机的
#    只读文件会直接退出：
#        `Sentinel config file ... is not writable: Read-only file system.`
#    本文件因此是**参数与取舍的说明**，实际生成由 compose 的 entrypoint 完成。
#
# ── 它解决什么、不解决什么 ────────────────────────────────────────
# Sentinel 做的是**主节点故障切换**：master 挂了，Sentinel 选一个 replica 升主，
# 并把新地址告诉客户端。它**不做数据分片**——那需要 Cluster，而当前数据量
# （十几 MB）远没到单主上限，上 Cluster 只会带来跨 slot 限制与运维复杂度。
#
# 🔴 **单机上的 Sentinel 防不了整机故障。** master / replica / sentinel 都在
#    同一台机器时，那台机器一挂三个进程一起没。本方案的价值在**Redis 进程级**
#    故障（OOM kill、容器崩溃、主节点磁盘写满只读）。真高可用要等第二台机器，
#    把 replica 与 sentinel 拆到独立故障域。
#
# ── 关键参数 ────────────────────────────────────────────────────
#   sentinel monitor <master> <host> 6379 <quorum>
#       quorum=2（三个 sentinel 中两个同意才判定下线）。
#   sentinel auth-pass <master> <password>
#       ⚠️ 必须与 master 的 requirepass 一致；否则 Sentinel 无法连上 master，
#          永远报告 down，failover 不会发生。
#   sentinel down-after-milliseconds <master> 5000
#       5 秒无响应即判定主观下线。太短会因短暂抖动误切，太长会拉长故障窗口。
#   sentinel failover-timeout <master> 60000
#       一次 failover 的总时限，也是「同一 master 两次 failover 的最小间隔」。
#   requirepass <sentinel-password>
#       Sentinel 自身的口令，与数据节点口令**不同**。客户端需要单独提供
#       （应用侧 = REDIS_SENTINEL_PASSWORD）。
#
# ── 防脑裂（只能写在 master 侧）─────────────────────────────────
# 这两项由 compose 的 redis 服务 command 注入，Sentinel 无法替 master 设置：
#   --min-replicas-to-write 1    没有健康 replica 时拒绝写入
#   --min-replicas-max-lag 10    replica 延迟超过 10 秒视为不健康
# 作用：被网络隔离的旧主若还连着（过期的）replica，就停止接受写入，
#       把「双主期间数据分叉」的窗口压到秒级。不能完全杜绝，但足够。
#
# ── 客户端要求（应用侧）──────────────────────────────────────────
#   REDIS_SENTINELS=host:26379            # Sentinel 地址，不是 Redis 主从地址
#   REDIS_MASTER_NAME=mymaster
#   REDIS_PASSWORD=<数据节点口令>
#   REDIS_SENTINEL_PASSWORD=<Sentinel 口令>
#
# 客户端必须走**哨兵发现**，不能直连主库 IP —— 否则故障切换后仍指向旧主
# （旧主已降为 replica，写入会报 READONLY）。
#
# ⚠️ BullMQ 的 worker 连接必须保留 `maxRetriesPerRequest: null`：Sentinel 切换
#    期间它会一直重连等待新主，这正是我们要的行为。producer / 限流侧则保持
#    快速失败（`maxRetriesPerRequest: 1`），避免请求悬挂。
#
# ── 演练记录 ────────────────────────────────────────────────────
# 本机 Docker 演练（master + replica + sentinel，杀掉 master 后 replica 升主、
# 新主可读写）见 ops/stress-test/sentinel-drill.sh。踩过的三个坑也在那个脚本头
# 注释里：配置不可只读挂载、Docker 内嵌 DNS 可能解析不了容器名、必须先等
# master PONG 再起 Sentinel。
