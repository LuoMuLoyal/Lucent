# Lucent Monitoring Stack Compose — 部署在**阿里云 1c2g**那台
# ---------------------------------------------------------------------------
# 为什么监控栈单独一台机器:
#
#   1. Grafana 查询 VictoriaMetrics 是**密集链路**。一个仪表盘刷新会打出几十个
#      range query。若 VM 在阿里云而 Grafana 留在鲲鹏,数据就要在公网上往返两次
#      (VM 拉鲲鹏的 /metrics → Grafana 再把同一份数据从阿里云拉回鲲鹏),还要
#      穿过 3M 带宽。四个服务同机后,Grafana → VM/VictoriaLogs/VictoriaTraces
#      全走容器网络,和原先一样便宜。
#
#   2. 监控与被观测对象分离:鲲鹏整台挂掉时,历史指标不会跟着一起没 —— 那正是
#      你最需要看指标的时刻。
#
#   3. 1c2g 的预算够:四者空载合计约 460 MB(VictoriaTraces 实测仅 7.5 MiB),
#      有数据时 700 MB–1 GB,系统占约 300 MB。所以每个服务都加了 memory limit
#      (见下),不能让 OOM killer 在 2 GB 的机器上随机挑一个杀。
#
# ⚠️ 与 compose.yaml 的关系:那份跑在鲲鹏,这份跑在阿里云,**两者互不依赖**,
#    各自 `docker compose -f <文件> up -d`。唯一关联是网络流量:
#
#      ┌── 阿里云 1c2g ──────────────────────┐
#      │  victoriametrics :8428  ←──┐        │
#      │  grafana        :3001   ───┘ 容器网络│
#      │  victorialogs   :9428                │
#      │  victoriatraces :10428               │
#      └──────────┬───────────────────────────┘
#                 │ 公网抓取(VM 主动 pull) / 公网推日志与 span(app 主动 push)
#      ┌──────────▼───────────────────────────┐
#      │  鲲鹏 4c8g                            │
#      │    app          :3000  (/metrics)     │
#      │    node-exporter:9100                 │
#      └──────────────────────────────────────┘
#
# 用哪个文件:`-f compose.monitoring.yaml`(在本目录下运行)。
# 环境变量同样读仓库根的 .env(阿里云那台只需 METRICS_* / GRAFANA_* /
# LUCENT_PUBLIC_HOST / VICTORIALOGS_URL,以及邮件告警那组 ALERT_EMAIL_TO /
# MAIL_* / GF_SMTP_ENABLED)。
#
# 两份文件的服务名与卷名**互不重叠**,所以在同一台机器上先后 `up` 也能共存
# (默认 project 名都是 `lucent`,但服务不冲突)。

services:
  # ── VictoriaMetrics(单机时序库,供 Grafana 查询) ──────────────
  # 抓取鲲鹏的 app /metrics 与 node-exporter;Basic Auth 凭据经环境变量
  # %{METRICS_USER}/%{METRICS_PASSWORD} 占位符注入(无需渲染脚本)。
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: unless-stopped
    ports:
      # VMUI / 查询接口,公网访问由云安全组收口
      - '8428:8428'
    volumes:
      - ./monitoring/victoriametrics/vmscraper.yml:/etc/vmscraper.yml:ro
      - victoriametrics-data:/storage
    environment:
      METRICS_USER: ${METRICS_USER}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      # 抓取目标所在机器(鲲鹏)的公网地址,由 vmscraper.yml 经 %{...} 展开。
      LUCENT_PUBLIC_HOST: ${LUCENT_PUBLIC_HOST:?LUCENT_PUBLIC_HOST is required — 鲲鹏的公网 IP 或域名(不带协议/端口)}
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=0.0.0.0:8428'
      # 抓取配置:不传这个参数时 VictoriaMetrics 不会加载 /etc/vmscraper.yml
      # (卷挂了文件也没用),app 与 node-exporter 的指标会一直是空的。
      - '-promscrape.config=/etc/vmscraper.yml'
    deploy:
      resources:
        limits:
          # 1c2g 上必须封顶:没有限制时容器可吃满 2 GB,触发 OOM killer
          # 随机杀进程(通常是 Grafana 或 VM 自己)。
          memory: 512M
    healthcheck:
      # VM 的 /health 不需要凭据(-http.pathPrefix 未改动时即本路径)。
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8428/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Grafana(查询 VM,走容器网络) ───────────────────────────────
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      # Grafana UI,公网访问由云安全组收口
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'

      # ── 邮件告警（Grafana 统一告警的发信通道）───────────────────────
      # 为什么告警在这里而不是 vmalert + Alertmanager:阿里云那台只有 1.6 GiB,
      # 四个监控服务的 memory limit 合计已 1792 MB。Grafana 本来就在跑,用它做
      # 告警评估与通知**不新增任何容器**;而 Alertmanager 还需要额外一个进程,
      # 且它的 alertmanager.yml 不支持环境变量插值(得靠渲染脚本,那套已随
      # Coolify 部署一起退役)。
      #
      # ⚠️ GF_SMTP_* 只在这里给值,不写进 provisioning 文件 —— 口令因此只落在
      #    被 gitignore 的 .env 里。规则/联系点/通知策略三个 YAML 全部可入库。
      #
      # ⚠️ GF_SMTP_ENABLED 必须显式为 true:默认 false 时 Grafana 会**静默**
      #    丢弃邮件通知(告警照常触发、状态页照常变红,但一封都不发)。
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${MAIL_HOST:-smtp.qq.com}:${MAIL_PORT:-587}
      GF_SMTP_USER: ${MAIL_USER:?MAIL_USER is required for alert email}
      GF_SMTP_PASSWORD: ${MAIL_PASS:?MAIL_PASS is required for alert email}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM:?MAIL_FROM is required for alert email}
      GF_SMTP_FROM_NAME: Lucent Alerting
      # QQ 邮箱用 587 + STARTTLS(非 465 隐式 TLS)。
      GF_SMTP_STARTTLS_POLICY: Opportunistic

      # 告警收件人。provisioning/alerting/contact-points.yml 里读 $ALERT_EMAIL_TO
      # (Grafana 12 的 alerting provisioning 支持环境变量插值,故仓库不写死邮箱)。
      # ⚠️ 留空则联系点地址为空,Grafana 不会报错,只是发不出去。
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?ALERT_EMAIL_TO is required for alert email}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/opt/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      # 同机依赖,可以表达(compose.yaml 那边跨机,故不写依赖)。
      victoriametrics:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── VictoriaLogs(日志库,鲲鹏的 app 通过 VICTORIALOGS_URL 直推) ──
  # ⚠️ 与 VM 不同:日志是**应用推**过来的,链路方向相反(鲲鹏 → 阿里云),
  #    写入通常比查询稀疏,所以这一跳走公网是可接受的。
  #    app 侧的 VICTORIALOGS_URL 要填 `http://<阿里云公网IP>:9428`。
  # Web UI 通过发布端口访问(安全组收口);应用日志同时进 stdout 由容器收集。
  victorialogs:
    # ⚠️ 版本线与 VictoriaMetrics **不同**:VictoriaLogs 现在是 1.5x(v1.51.1 起),
    # 不是 1.1x。此前这里写的 v1.15.0 在 Docker Hub 上根本不存在(实测
    # `manifest unknown`),意味着该服务从未真正起来过。与 compose.staging.yaml 对齐。
    image: victoriametrics/victoria-logs:v1.51.1
    restart: unless-stopped
    ports:
      - '9428:9428'
    volumes:
      - victorialogs-data:/storage
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=0.0.0.0:9428'
    deploy:
      resources:
        limits:
          # 日志量不可控,给一个比 VM 小的上限,超了宁可丢新日志也不要拖垮本机。
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── VictoriaTraces(分布式追踪库,补齐可观测性第三支柱) ──────────
  # 鲲鹏的 app 通过 OTLP/HTTP 推 span 过来(需 OTEL_ENABLED=true)。
  #
  # ⚠️ **OTLP/HTTP 的路径不是标准的 `/v1/traces`**,而是
  #      /insert/opentelemetry/v1/traces
  #    实测:发到 `/opentelemetry/v1/traces` 返回 400,发到上面这个返回 200。
  #    所以 app 侧的 OTEL_EXPORTER_OTLP_ENDPOINT 必须写完整路径,否则一个 span
  #    都收不到,而且默认端口是 10428(不是常见的 4318)。
  #
  # 轻量得多:实测空载 RSS 约 7.5 MiB(VictoriaTraces 建在 VictoriaLogs 之上,
  # 接收 OTLP → 转成结构化日志 → 对外提供 Jaeger Query API)。
  # 因此 256M 限额有极大余量,留够缓冲即可。
  #
  # ⚠️ 与 VictoriaLogs 一样**没有内建鉴权**。官方文档明确要求它"运行在无法从
  #    公网直达的环境中"。当前口径是**安全组按来源 IP 白名单作唯一防线**;
  #    若要加固,可加 `-httpAuth.username` / `-httpAuth.password`(覆盖整个 HTTP
  #    服务,包括写入与 /metrics),代价是 Grafana 数据源与抓取都要带凭据。
  victoriatraces:
    # 钉具体版本:该项目尚在 0.x(官方 README 明说"磁盘结构与 API 可能不向后兼容"),
    # 用 `latest` 会在某次 `docker compose pull` 后静默换大版本。
    image: victoriametrics/victoria-traces:v0.12.0
    restart: unless-stopped
    ports:
      # 10428 = HTTP API / Jaeger Query / OTLP-HTTP 写入,全在同端口。
      - '10428:10428'
    volumes:
      - victoriatraces-data:/data
    command:
      - '-storageDataPath=/data'
      # 追踪数据只保留 7 天(与 VM 的 30d 不同):span 是排查用的短期素材,
      # 放久了既占盘也几乎不会再查。
      - '-retentionPeriod=7d'
      - '-httpListenAddr=0.0.0.0:10428'
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  victoriametrics-data:
  grafana-data:
  victorialogs-data:
  # ⚠️ 必须显式声明:漏了会让 compose 静默创建匿名卷,容器重建即丢失全部 trace。
  victoriatraces-data:
