# VictoriaMetrics scrape 配置(Staging,无 node-exporter,只抓 app)
# Basic Auth 凭据通过 %{ENV_VAR} 占位符注入,与 compose.staging.yaml
# 传给 victoriametrics 容器的 METRICS_USER / METRICS_PASSWORD 一致。
# 注意:与 compose.yaml 使用的 vmscraper.yml(含 node 抓取 job)分文件维护;
# 修改 app 抓取配置时两处同步。
#
# 目标 host.docker.internal:3000 指向宿主机的 PM2 进程(app 不在容器里);
# 该主机名由 compose.staging.yaml 里 victoriametrics 的
# extra_hosts: host.docker.internal:host-gateway 提供。

scrape_configs:
  - job_name: 'lucent'
    metrics_path: /metrics
    basic_auth:
      username: '%{METRICS_USER}'
      password: '%{METRICS_PASSWORD}'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'lucent-backend'
