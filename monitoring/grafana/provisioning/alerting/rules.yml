                            'evaluator': { 'params': [], 'type': 'gt' },
                            'operator': { 'type': 'and' },
                            'query': { 'params': ['B'] },
                            'reducer': { 'params': [], 'type': 'last' },
                            'type': 'query',
                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'A',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'reducer': 'last',
                      'refId': 'B',
                      'type': 'reduce',
                    },
