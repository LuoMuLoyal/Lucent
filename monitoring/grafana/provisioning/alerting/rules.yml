              ],
            'noDataState': 'NoData',
            'execErrState': 'Error',
            'for': '10m',
            'labels': { 'severity': 'warning', 'service': 'lucent' },
            'annotations':
              {
                'summary': 'HTTP p99 延迟连续 10 分钟高于 3 秒，接口明显变慢。',
