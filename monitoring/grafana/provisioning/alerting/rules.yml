                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'B',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'refId': 'C',
                      'type': 'threshold',
