# Lucent 告警规则（Grafana 统一告警）
# ---------------------------------------------------------------------------
# 由 compose.monitoring.yaml 挂到 Grafana 的 /etc/grafana/provisioning:ro，
# Grafana 启动时自动装载；改完重启容器生效（provisioned 资源不能在 UI 里改）。
#
# 为什么用 Grafana 统一告警而不是 vmalert + Alertmanager：阿里云那台只有
# 1.6 GiB 内存，四个监控服务限额已占 1792 MB；Grafana 已在跑，用它不新增进程。
#
# ⚠️ data.model 段**不支持**环境变量插值（Grafana 文档明确列出），所以下面的
#    PromQL 一律是字面量。annotations 同样不插值，故 `{{ $labels.x }}` 可安全直写。
#
# ⚠️ 数据源 uid 必须是 `prometheus`（见 provisioning/datasources/prometheus.yml）。

apiVersion: 1

groups:
  - {
      'orgId': 1,
      'name': 'lucent-availability',
      'folder': 'lucent-availability',
      'interval': '1m',
      'rules':
        [
          {
            'uid': 'lucent_down',
            'title': 'LucentDown',
            'condition': 'C',
            'data':
              [
                {
                  'refId': 'A',
                  'relativeTimeRange': { 'from': 300, 'to': 0 },
                  'datasourceUid': 'prometheus',
                  'model':
                    {
                      'editorMode': 'code',
                      'expr': 'up{job="lucent"} == 0',
                      'instant': false,
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'range': true,
                      'refId': 'A',
                    },
                },
                {
                  'refId': 'B',
                  'datasourceUid': '__expr__',
                  'model':
                    {
                      'conditions':
                        [
                          {
                            'evaluator': { 'params': [], 'type': 'gt' },
                            'operator': { 'type': 'and' },
                            'query': { 'params': ['B'] },
                            'reducer': { 'params': [], 'type': 'last' },
                            'type': 'query',
                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'A',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'reducer': 'last',
                      'refId': 'B',
                      'type': 'reduce',
                    },
                },
                {
                  'refId': 'C',
                  'datasourceUid': '__expr__',
                  'model':
                    {
                      'conditions':
                        [
                          {
                            'evaluator': { 'params': [-1], 'type': 'gt' },
                            'operator': { 'type': 'and' },
                            'query': { 'params': ['C'] },
                            'reducer': { 'params': [], 'type': 'last' },
                            'type': 'query',
                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'B',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'refId': 'C',
                      'type': 'threshold',
                    },
                },
              ],
            'noDataState': 'NoData',
            'execErrState': 'Error',
            'for': '2m',
            'labels': { 'severity': 'critical', 'service': 'lucent' },
            'annotations':
              {
                'summary': '鲲鹏主站 /metrics 已连续 2 分钟抓不到（up=0），app 可能已挂。',
                'runbook': '⚠️ 跨云抓取：也可能是鲲鹏安全组收口了阿里云出口 IP，或 3M 带宽拥塞 —— 先手工 `curl http://<鲲鹏IP>:3000/metrics` 从阿里云那台确认，再判断是不是 app 真挂了。',
              },
            'isPaused': false,
          },
          {
            'uid': 'lucent_node_down',
            'title': 'KunpengHostDown',
            'condition': 'C',
            'data':
              [
                {
                  'refId': 'A',
                  'relativeTimeRange': { 'from': 300, 'to': 0 },
                  'datasourceUid': 'prometheus',
                  'model':
                    {
                      'editorMode': 'code',
                      'expr': 'up{job="node"} == 0',
                      'instant': false,
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'range': true,
                      'refId': 'A',
                    },
                },
                {
                  'refId': 'B',
                  'datasourceUid': '__expr__',
                  'model':
                    {
                      'conditions':
                        [
                          {
                            'evaluator': { 'params': [], 'type': 'gt' },
                            'operator': { 'type': 'and' },
                            'query': { 'params': ['B'] },
                            'reducer': { 'params': [], 'type': 'last' },
                            'type': 'query',
                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'A',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'reducer': 'last',
                      'refId': 'B',
                      'type': 'reduce',
                    },
                },
                {
                  'refId': 'C',
                  'datasourceUid': '__expr__',
                  'model':
                    {
                      'conditions':
                        [
                          {
                            'evaluator': { 'params': [-1], 'type': 'gt' },
                            'operator': { 'type': 'and' },
                            'query': { 'params': ['C'] },
                            'reducer': { 'params': [], 'type': 'last' },
                            'type': 'query',
                          },
                        ],
                      'datasource': { 'type': '__expr__', 'uid': '__expr__' },
                      'expression': 'B',
                      'intervalMs': 1000,
                      'maxDataPoints': 43200,
                      'refId': 'C',
                      'type': 'threshold',
                    },
                },
              ],
            'noDataState': 'NoData',
            'execErrState': 'Error',
            'for': '5m',
            'labels': { 'severity': 'warning', 'service': 'lucent' },
            'annotations':
              {
                'summary': '鲲鹏 node-exporter（:9100）连续 5 分钟抓不到，主机指标断流。',
                'runbook': '主机可能重启、node-exporter 容器停了，或安全组变更。app 本身的告警看 LucentDown。',
              },
            'isPaused': false,
          },
        ],
    }
