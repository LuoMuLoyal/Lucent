# 通知策略树
# ---------------------------------------------------------------------------
# ⚠️ 整个策略树是**一个**资源，只能在一处完整定义；不要拆成多个文件。
#
# critical 立即发；warning 归到同一组里降频，避免演示时被噪声淹没。

apiVersion: 1

policies:
  - orgId: 1
    receiver: lucent-email
    group_by: ['alertname', 'grafana_folder']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: lucent-email
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        # critical 反复提醒，直到恢复。
        repeat_interval: 1h
      - receiver: lucent-email
        object_matchers:
          - ['severity', '=', 'warning']
        repeat_interval: 12h
