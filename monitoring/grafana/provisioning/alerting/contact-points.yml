# 告警联系点：邮件（SMTP）
# ---------------------------------------------------------------------------
# Grafana 12 的 alerting provisioning **支持** `$VAR` 环境变量插值
# （官方文档「Template variable interpolation」一节；不支持插值的只有
#  annotations / relativeTimeRange / data.model / muteTimes 名与时段 /
#  templates 名与正文）。所以收件地址从容器环境读，仓库里不写死邮箱。
#
# ⚠️ SMTP 口令**不在本文件**：走 Grafana 全局配置 GF_SMTP_PASSWORD
#    （见 compose.monitoring.yaml），真值只落在 gitignore 的 .env 里。

apiVersion: 1

contactPoints:
  - orgId: 1
    name: lucent-email
    receivers:
      - uid: lucent_email_alert
        type: email
        settings:
          # 收件人由 ALERT_EMAIL_TO 注入（阿里云 .env）。
          addresses: $ALERT_EMAIL_TO
          # 多条告警合并进一封，避免刷屏。
          singleEmail: false
        disableResolveMessage: false
