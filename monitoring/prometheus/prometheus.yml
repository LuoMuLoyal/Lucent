global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: lucent-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:3000

  - job_name: lucent-synthetic
    metrics_path: /metrics
    static_configs:
      - targets:
          - synthetic-monitor:9101
