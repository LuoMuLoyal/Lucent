# Lucent 文档覆盖映射
#
# scripts/hooks/check-docs-updated.ts 读取本文件（唯一事实源）：
# - docs_required：必改文档，全部命中才满足（通常只有迁移日志）
# - docs_any_of：  至少命中其一（按变更性质选择）
# - docs_info：    仅建议，缺失不警告
# - 阻断模式（默认，pre-commit）：有代码变更但无任何 docs/ 文件变更 → exit(1)
# - 校验模式（--verify）：引用文件存在、迁移日志单 H1、plans/spec 引用有效、活跃文档新鲜度与读者
# - 旁路：SKIP_DOC_CHECK=1
#
# glob 规则：* 匹配单层路径，** 匹配多层路径。
# 归档的功能状态文档在 03-archive/，不参与覆盖映射（历史可追溯，不强制同步）。

rules:
  # ──────────────────────────────────────────────
  # 工具链与治理
  # ──────────────────────────────────────────────
  - name: docs-tooling
    code:
      - scripts/hooks/**
      - scripts/contract/**
      - .github/**
      - package.json
      - tsconfig.json
      - .swcrc
      - commitlint.config.ts
      - pnpm-workspace.yaml
      - AGENTS.md
      - docs/doc-map.yaml
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/toolchain.md
      - docs/01-reference/code-quality.md
      - docs/01-reference/environment.md
    docs_info:
      - docs/00-current/TODO.md

  # ──────────────────────────────────────────────
  # 基础设施（bootstrap、配置、Prisma、i18n、Admin、邮件）
  # ──────────────────────────────────────────────
  - name: infrastructure
    code:
      - src/main.ts
      - src/app.module.ts
      - src/setup-app.ts
      - src/config/**
      - src/prisma/**
      - src/mail/**
      - src/i18n/**
      - src/admin/**
      - prisma/schema.prisma
      - prisma/migrations/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/architecture.md
      - docs/01-reference/environment.md
      - docs/01-reference/toolchain.md
      - docs/01-reference/code-quality.md

  # ──────────────────────────────────────────────
  # 共享层（common/）
  # ──────────────────────────────────────────────
  - name: common-shared
    code:
      - src/common/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/architecture.md
      - docs/01-reference/code-quality.md

  # ──────────────────────────────────────────────
  # 认证与安全（auth、security-pin、account）
  # ──────────────────────────────────────────────
  - name: auth-security
    code:
      - src/modules/auth/**
      - src/modules/security-pin/**
      - src/modules/account/**
    docs_required:
      - docs/02-logs/migration-log/*.md

  # ──────────────────────────────────────────────
  # 审计日志（audit-log，全局安全操作记录）
  # ──────────────────────────────────────────────
  - name: audit-log
    code:
      - src/modules/audit-log/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/architecture.md
      - docs/01-reference/code-quality.md

  # ──────────────────────────────────────────────
  # 用户域（user、health-context、settings）
  # ──────────────────────────────────────────────
  - name: user-domain
    code:
      - src/modules/user/**
      - src/modules/user-health-context/**
      - src/modules/user-settings/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/contracts/mine-settings-contract.md

  # ──────────────────────────────────────────────
  # 健康事件合同
  # ──────────────────────────────────────────────
  - name: health-events
    code:
      - src/modules/health-events/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/00-current/Active_Product_Loop.md

  # ──────────────────────────────────────────────
  # 日常记录与餐食分析
  # ──────────────────────────────────────────────
  - name: daily-records
    code:
      - src/modules/daily-records/**
    docs_required:
      - docs/02-logs/migration-log/*.md

  # ──────────────────────────────────────────────
  # 药品域（medicines、dose-logs、reminders）
  # ──────────────────────────────────────────────
  - name: medicine
    code:
      - src/modules/medicines/**
      - src/modules/medicine-dose-logs/**
      - src/modules/medicine-reminders/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/contracts/reminder-contract.md

  # ──────────────────────────────────────────────
  # Assistant AI 管道
  # ──────────────────────────────────────────────
  - name: assistant-ai
    code:
      - src/modules/assistant/**
      - src/modules/today-analysis/**
      - src/llm-runtime/**
      - src/common/llm/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/architecture.md
      - docs/01-reference/contracts/assistant-contract.md
      - docs/01-reference/contracts/assistant-capabilities.md
      - docs/01-reference/contracts/assistant-safety.md
    docs_info:
      - docs/01-reference/contracts/assistant-rollout.md

  # ──────────────────────────────────────────────
  # Today 主动建议引擎
  # ──────────────────────────────────────────────
  - name: today-suggestion
    code:
      - src/modules/today-suggestion/**
    docs_required:
      - docs/02-logs/migration-log/*.md

  # ──────────────────────────────────────────────
  # 报告与导出
  # ──────────────────────────────────────────────
  - name: report-export
    code:
      - src/modules/reports/**
      - src/modules/data-export/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/contracts/data-export-contract.md
      - docs/01-reference/data-retention.md

  # ──────────────────────────────────────────────
  # 产品事件测量（product-events）
  # ──────────────────────────────────────────────
  - name: product-events
    code:
      - src/modules/product-events/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/data-retention.md
      - docs/00-current/Active_Product_Loop.md

  # ──────────────────────────────────────────────
  # 数据保留与账户删除级联
  # ──────────────────────────────────────────────
  - name: data-retention
    code:
      - src/modules/data-retention/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/data-retention.md

  # ──────────────────────────────────────────────
  # 通知
  # ──────────────────────────────────────────────
  - name: notifications
    code:
      - src/modules/notifications/**
    docs_required:
      - docs/02-logs/migration-log/*.md

  # ──────────────────────────────────────────────
  # 支持文件、环境快照、测试支持
  # ──────────────────────────────────────────────
  - name: support-files-env
    code:
      - src/modules/support-resources/**
      - src/modules/files/**
      - src/modules/environment/**
      - src/modules/testing-support/**
      - src/modules/legal-documents/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/contracts/support-resources-contract.md
      - docs/01-reference/contracts/environment-contract.md

  # ──────────────────────────────────────────────
  # OpenAPI 合同与公共合同文件
  # ──────────────────────────────────────────────
  - name: docs-openapi
    code:
      - docs/openapi.json
      - docs/01-reference/contracts/**
    docs_required:
      - docs/02-logs/migration-log/*.md
    docs_any_of:
      - docs/01-reference/toolchain.md
