# Lucent 文档覆盖映射(过渡期机制,两周观察后随 --report 一并退役,进度见 docs/TODO.md G1)
#
# scripts/docs/verify.ts 读取本文件:
# - docs_required：必改文档,全部命中才满足(通常只有迁移日志)
# - docs_any_of：  至少命中其一(模块意图变更首选对应 src/modules/<m>/README.md)
# - docs_info：    仅建议,缺失不警告
# - 报告模式(默认):有代码变更时打印覆盖映射报告,永不阻断(--report;--warning-only 为退役别名)
# - 校验模式(--verify):引用文件存在、迁移日志单 H1、plans/spec 引用有效、活跃文档新鲜度与读者
#   迁移日志 append-only 守卫(单文件 diff 删除行 >5 报违规)亦在 --verify 内
#
# glob 规则：* 匹配单层路径,** 匹配多层路径。
# 历史与过程性文档在 docs/archive/,不参与覆盖映射(只进不出,不强制同步)。
# 生成物在 docs/reference/generated/(openapi.json、compodoc),由生成器产出,禁止手改。
# 迁移日志条目约定:描述变更范围与验证结论,不写需要持续同步的精确数字(如测试总数),见 AGENTS.md。

rules:
  # ──────────────────────────────────────────────
  # 工具链与治理
  # ──────────────────────────────────────────────
  - name: docs-tooling
    code:
      - scripts/docs/**
      - scripts/arch/**
      - scripts/contract/**
      - scripts/dev/**
      - scripts/spike/**
      - .github/**
      - package.json
      - tsconfig.json
      - .swcrc
      - commitlint.config.ts
      - pnpm-workspace.yaml
      - AGENTS.md
      - docs/doc-map.yaml
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/reference/environment-variables.md
      - docs/README.md
    docs_info:
      - docs/TODO.md
      - docs/reference/glossary.md

  # ──────────────────────────────────────────────
  # 基础设施(bootstrap、配置、Prisma、i18n、Admin、邮件)
  # ──────────────────────────────────────────────
  - name: infrastructure
    code:
      - src/main.ts
      - src/app.module.ts
      - src/setup-app.ts
      - src/config/**
      - src/prisma/**
      - src/mail/**
      - src/i18n/**
      - src/admin/**
      - prisma/schema.prisma
      - prisma/migrations/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/explanation/architecture.md
      - docs/reference/environment-variables.md

  # ──────────────────────────────────────────────
  # 共享层(common/)
  # ──────────────────────────────────────────────
  - name: common-shared
    code:
      - src/common/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/explanation/architecture.md
      - src/common/README.md
      - docs/reference/logging-conventions.md

  # ──────────────────────────────────────────────
  # 认证与安全(auth、account)
  # ──────────────────────────────────────────────
  - name: auth-security
    code:
      - src/modules/auth/**
      - src/modules/account/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/auth/README.md
      - src/modules/account/README.md

  # ──────────────────────────────────────────────
  # 审计日志(audit-log,全局安全操作记录)
  # ──────────────────────────────────────────────
  - name: audit-log
    code:
      - src/modules/audit-log/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/explanation/architecture.md
      - src/modules/audit-log/README.md

  # ──────────────────────────────────────────────
  # 用户域(user、health-context、settings)
  # ──────────────────────────────────────────────
  - name: user-domain
    code:
      - src/modules/user/**
      - src/modules/user-health-context/**
      - src/modules/user-settings/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/user-settings/README.md
      - src/modules/user-health-context/README.md
      - src/modules/user/README.md

  # ──────────────────────────────────────────────
  # 健康事件
  # ──────────────────────────────────────────────
  - name: health-events
    code:
      - src/modules/health-events/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/health-events/README.md

  # ──────────────────────────────────────────────
  # 日常记录与餐食分析
  # ──────────────────────────────────────────────
  - name: daily-records
    code:
      - src/modules/daily-records/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/daily-records/README.md

  # ──────────────────────────────────────────────
  # 药品域(medicines、dose-logs、reminders)
  # ──────────────────────────────────────────────
  - name: medicine
    code:
      - src/modules/medicines/**
      - src/modules/medicine-dose-logs/**
      - src/modules/medicine-reminders/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/medicines/README.md
      - src/modules/medicine-reminders/README.md
      - src/modules/medicine-dose-logs/README.md

  # ──────────────────────────────────────────────
  # Assistant AI 管道
  # ──────────────────────────────────────────────
  - name: assistant-ai
    code:
      - src/modules/assistant/**
      - src/modules/today-analysis/**
      - src/llm-runtime/**
      - src/common/llm/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/explanation/architecture.md
      - src/modules/assistant/README.md
      - docs/reference/assistant-safety.md
    docs_info:
      - src/modules/today-analysis/README.md

  # ──────────────────────────────────────────────
  # Today 主动建议引擎
  # ──────────────────────────────────────────────
  - name: today-suggestion
    code:
      - src/modules/today-suggestion/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/today-suggestion/README.md

  # ──────────────────────────────────────────────
  # 报告与导出
  # ──────────────────────────────────────────────
  - name: report-export
    code:
      - src/modules/reports/**
      - src/modules/data-export/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/reports/README.md
      - src/modules/data-export/README.md
      - docs/reference/data-retention.md

  # ──────────────────────────────────────────────
  # 产品事件测量(product-events)
  # ──────────────────────────────────────────────
  - name: product-events
    code:
      - src/modules/product-events/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/product-events/README.md
      - docs/reference/data-retention.md

  # ──────────────────────────────────────────────
  # 数据保留与账户删除级联
  # ──────────────────────────────────────────────
  - name: data-retention
    code:
      - src/modules/data-retention/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/reference/data-retention.md
      - src/modules/data-retention/README.md

  # ──────────────────────────────────────────────
  # 通知
  # ──────────────────────────────────────────────
  - name: notifications
    code:
      - src/modules/notifications/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/notifications/README.md

  # 跨设备通知偏好与服务端通知门禁
  - name: notification-preferences
    code:
      - src/modules/notification-preferences/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/notification-preferences/README.md

  # ──────────────────────────────────────────────
  # 支持文件、环境快照、测试支持
  # ──────────────────────────────────────────────
  - name: support-files-env
    code:
      - src/modules/app-info/**
      - src/modules/files/**
      - src/modules/environment/**
      - src/modules/testing-support/**
      - src/modules/legal-documents/**
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - src/modules/app-info/README.md
      - src/modules/environment/README.md
      - src/modules/files/README.md
      - src/modules/testing-support/README.md
      - src/modules/legal-documents/README.md

  # ──────────────────────────────────────────────
  # OpenAPI 生成物
  # ──────────────────────────────────────────────
  - name: docs-openapi
    code:
      - docs/reference/generated/openapi.json
    docs_required:
      - docs/logs/migration-log/*.md
    docs_any_of:
      - docs/README.md
