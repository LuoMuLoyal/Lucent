services:
  # ── Neo4j (development) ──────────────────────────────────────
  # 英文侧 OAG 的图后端。semantica-service 经 Bolt 访问它;Lucent 自己**从不直连**。
  # dev 通常不需要这个容器 —— 直接 `docker run` 或本机装一个都行,见
  # deploy/semantica/.env.example。这里定义它只是让"一条命令起 dev 依赖"成立。
  #
  # 内存显式封顶(与 staging 同值):默认约 1.5 GiB。heap 512m + pagecache 256m
  # 是实测基线 —— 本图(3,278 节点 / 211,630 边)RSS 1,243 MiB。
  #
  # ⚠️ 除 NEO4J_AUTH 外,任何 `NEO4J_` 前缀变量都被当作配置键解析,未声明的键
  # 会让容器**拒绝启动**(实测 `server.memory.recovery_policy` 在 5.26 不存在)。
  neo4j-dev:
    image: ${NEO4J_IMAGE:-neo4j:5.26.31-community}
    container_name: lucent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jdevpassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # healthcheck 用:非 NEO4J_ 前缀,否则会被解析成 `server.password` 而报错。
      LUCENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jdevpassword}
    ports:
      - '127.0.0.1:7687:7687' # Bolt
      - '127.0.0.1:7474:7474' # HTTP:浏览器排查
    volumes:
      - neo4j-dev-data:/data
      - neo4j-dev-logs:/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cypher-shell -u neo4j -p "$$LUCENT_NEO4J_PASSWORD" "RETURN 1" >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── PostgreSQL 18 (development) ──────────────────────────────
  # 镜像含 pgvector 与 zhparser(见 docker/postgres/)。图数据在 Neo4j,不经这里。
  # 构建一次即可：
  #   docker build -t lucent-db:18 docker/postgres
  postgres-dev:
    image: ${LUCENT_DB_IMAGE:-lucent-db:18}
    container_name: lucent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lucent
    ports:
      - '15432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL 18 (test / e2e) ───────────────────────────────
  postgres-test:
    image: ${LUCENT_DB_IMAGE:-lucent-db:18}
    container_name: lucent-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: lucent_dev
      POSTGRES_DB: lucent
    ports:
      - '5432:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 8 ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: lucent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── LightRAG sidecar（中文散文检索；profile 内，默认不启动）─────
  # 默认 `docker compose -f compose.dev.yaml up -d` **不会**起它——它拖慢本地启动
  # 且需要模型 key。需要中文散文检索时显式带 profile：
  #   cp deploy/lightrag/.env.example deploy/lightrag/.env   # 填模型 key 与 LIGHTRAG_API_KEY
  #   docker compose -f compose.dev.yaml --profile lightrag up -d lightrag
  #
  # 配置只来自 deploy/lightrag/.env（独立文件，不含 Lucent 的 JWT_* / DATABASE_URL /
  # 微信密钥——见 docs/reference/environment-variables.md 的 LightRAG 小节）。
  # 端口只绑回环：Lucent 本地进程走 http://127.0.0.1:9621。
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lucent-lightrag
    profiles: ['lightrag']
    restart: unless-stopped
    env_file:
      - deploy/lightrag/.env
    environment:
      # 容器内访问宿主 Postgres（独立 database `lightrag`，不污染 Prisma 迁移域）。
      # compose.dev 的 postgres-dev 发布在宿主 15432；容器走 host-gateway 回环。
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: '15432'
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # 领域本体 prompt profile 的根目录；ENTITY_TYPE_PROMPT_FILE 相对它解析。
      PROMPT_DIR: /app/data/prompts
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9621:9621'
    volumes:
      - lightrag-data:/app/data
      # 只读挂载：prompt 是配置事实源，必须在宿主仓库里可评审、可 diff，
      # 而不是靠 docker cp 拷进容器（那样重启即丢、也没法 code review）。
      - ./deploy/lightrag/prompts:/app/data/prompts:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9621/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Semantica(英文侧 OAG sidecar)───────────────────────────────
  # 本体推理:图是 DrugBank 结构化字段的确定性灌入(零 LLM 抽取、零 token),服务只做
  # 只读 Cypher 的校验 + 执行、SHACL 校验与规则推理,**自身不持有模型凭据**
  # (NL→Cypher 的生成在 Lucent 侧),因此 Lucent 那边也没有对应的 API key 项。
  #
  # dev 默认不起它:**开发环境直接在本机跑**更省事,也不需要镜像:
  #   cd semantica-service && uv run uvicorn semantica_service.main:app --port 8099
  # 然后在 .env.development 里设 SEMANTICA_ENABLED=true 与
  # SEMANTICA_BASE_URL=http://127.0.0.1:8099。本服务定义与下面 lightrag 同形,
  # 是为了需要容器化时形态一致(见 compose.yaml 的同名服务)。
  #
  # 配置只来自 deploy/semantica/.env(独立文件,不含 Lucent 的 JWT_* / DATABASE_URL
  # / 微信密钥),模板见该目录 .env.example。
  semantica:
    image: ${SEMANTICA_IMAGE:-lucent-semantica:latest}
    container_name: lucent-semantica
    profiles: ['semantica']
    restart: unless-stopped
    env_file:
      - deploy/semantica/.env
    environment:
      # 容器内访问图库:走 compose 服务名 `neo4j-dev`(服务名即可解析)。
      # 口令与 neo4j-dev 的 NEO4J_AUTH 一致,改一处要改两处。
      NEO4J_URI: bolt://neo4j-dev:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jdevpassword}
    depends_on:
      neo4j-dev:
        condition: service_healthy
    ports:
      # 只绑回环:Lucent 本地进程走 http://127.0.0.1:8099
      - '127.0.0.1:8099:8099'
    healthcheck:
      # /health 真借一条 Bolt 连接读图规模,图不可达时返回 503 → 探针如实失败。
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8099/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Jaeger (OpenTelemetry trace backend) ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: lucent-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP receiver

  # ── SeaweedFS (dev-only S3-compatible object storage) ──────
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    container_name: lucent-seaweedfs
    restart: unless-stopped
    # The image entrypoint (/entrypoint.sh) already dispatches the first
    # argument as a weed subcommand — do NOT prefix it with `weed`.
    command: >
      server
      -dir=/data
      -s3
      -master.port=9333
      -volume.port=8080
      -filer.port=8888
      -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: lucent-dev
      AWS_SECRET_ACCESS_KEY: lucent-dev-secret
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # Filer (anonymous read for dev)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'weed',
          'shell',
          '-master=localhost:9333',
          '-cluster=',
          'cluster.check',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
  pgdata-test:
  redisdata:
  neo4j-dev-data:
  neo4j-dev-logs:
  seaweedfs-data:
  lightrag-data:
