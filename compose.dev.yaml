services:
  # ── PostgreSQL 18 (development) ──────────────────────────────
  postgres-dev:
    image: pgvector/pgvector:pg18
    container_name: lucent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lucent
    ports:
      - '15432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL 18 (test / e2e) ───────────────────────────────
  postgres-test:
    image: pgvector/pgvector:pg18
    container_name: lucent-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: lucent_dev
      POSTGRES_DB: lucent
    ports:
      - '5432:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 8 ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: lucent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Jaeger (OpenTelemetry trace backend) ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: lucent-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP receiver

  # ── SeaweedFS (dev-only S3-compatible object storage) ──────
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    container_name: lucent-seaweedfs
    restart: unless-stopped
    command: >
      weed server
      -dir=/data
      -s3
      -master.port=9333
      -volume.port=8080
      -filer.port=8888
      -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: lucent-dev
      AWS_SECRET_ACCESS_KEY: lucent-dev-secret
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # Filer (anonymous read for dev)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'weed',
          'shell',
          '-master=localhost:9333',
          '-cluster=',
          'cluster.check',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
  pgdata-test:
  redisdata:
  seaweedfs-data:
