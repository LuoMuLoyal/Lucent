services:
  # ── Neo4j (development) ──────────────────────────────────────
  # 英文侧 OAG 的图后端。semantica-service 经 Bolt 访问它;Lucent 自己**从不直连**。
  # dev 通常不需要这个容器 —— 直接 `docker run` 或本机装一个都行,见
  # infra/semantica/.env.example。这里定义它只是让"一条命令起 dev 依赖"成立。
  #
  # 内存显式封顶(与 staging 同值):默认约 1.5 GiB。heap 512m + pagecache 256m
  # 是实测基线 —— 本图(3,278 节点 / 211,630 边)RSS 1,243 MiB。
  #
  # ⚠️ 除 NEO4J_AUTH 外,任何 `NEO4J_` 前缀变量都被当作配置键解析,未声明的键
  # 会让容器**拒绝启动**(实测 `server.memory.recovery_policy` 在 5.26 不存在)。
  neo4j-dev:
    image: ${NEO4J_IMAGE:-neo4j:5.26.31-community}
    container_name: lucent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jdevpassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # healthcheck 用:非 NEO4J_ 前缀,否则会被解析成 `server.password` 而报错。
      LUCENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jdevpassword}
    ports:
      - '127.0.0.1:7687:7687' # Bolt
      - '127.0.0.1:7474:7474' # HTTP:浏览器排查
    volumes:
      - neo4j-dev-data:/data
      - neo4j-dev-logs:/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cypher-shell -u neo4j -p "$$LUCENT_NEO4J_PASSWORD" "RETURN 1" >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── PostgreSQL 18 (development) ──────────────────────────────
  # 镜像含 pgvector 与 zhparser(见 docker/postgres/)。图数据在 Neo4j,不经这里。
  # 构建一次即可：
  #   docker build -t lucent-db:18 docker/postgres
  postgres-dev:
    image: ${LUCENT_DB_IMAGE:-lucent-db:18}
    container_name: lucent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lucent
    ports:
      - '15432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL 18 (test / e2e) ───────────────────────────────
  postgres-test:
    image: ${LUCENT_DB_IMAGE:-lucent-db:18}
    container_name: lucent-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: lucent_dev
      POSTGRES_DB: lucent
    ports:
      - '5432:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 8 ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: lucent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── LightRAG sidecar（中文散文检索；profile 内，默认不启动）─────
  # 默认 `docker compose -f compose.dev.yaml up -d` **不会**起它——它拖慢本地启动
  # 且需要模型 key。需要中文散文检索时显式带 profile：
  #   cp infra/lightrag/.env.example infra/lightrag/.env   # 填模型 key 与 LIGHTRAG_API_KEY
  #   docker compose -f compose.dev.yaml --profile lightrag up -d lightrag
  #
  # 配置只来自 infra/lightrag/.env（独立文件，不含 Lucent 的 JWT_* / DATABASE_URL /
  # 微信密钥——见 docs/reference/environment-variables.md 的 LightRAG 小节）。
  # 端口只绑回环：Lucent 本地进程走 http://127.0.0.1:9621。
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lucent-lightrag
    profiles: ['lightrag']
    restart: unless-stopped
    env_file:
      - infra/lightrag/.env
    environment:
      # 容器内访问宿主 Postgres（独立 database `lightrag`，不污染 Prisma 迁移域）。
      # compose.dev 的 postgres-dev 发布在宿主 15432；容器走 host-gateway 回环。
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: '15432'
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # 领域本体 prompt profile 的根目录；ENTITY_TYPE_PROMPT_FILE 相对它解析。
      PROMPT_DIR: /app/data/prompts
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9621:9621'
    volumes:
      - lightrag-data:/app/data
      # 只读挂载：prompt 是配置事实源，必须在宿主仓库里可评审、可 diff，
      # 而不是靠 docker cp 拷进容器（那样重启即丢、也没法 code review）。
      - ./infra/lightrag/prompts:/app/data/prompts:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9621/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Semantica(英文侧 OAG sidecar)───────────────────────────────
  # 本体推理:图是 DrugBank 结构化字段的确定性灌入(零 LLM 抽取、零 token),服务只做
  # 只读 Cypher 的校验 + 执行、SHACL 校验与规则推理,**自身不持有模型凭据**
  # (NL→Cypher 的生成在 Lucent 侧),因此 Lucent 那边也没有对应的 API key 项。
  #
  # dev 默认不起它:**开发环境直接在本机跑**更省事,也不需要镜像:
  #   cd apps/ontology && uv run uvicorn semantica_service.main:app --port 8099
  # 然后在 .env.development 里设 SEMANTICA_ENABLED=true 与
  # SEMANTICA_BASE_URL=http://127.0.0.1:8099。本服务定义与下面 lightrag 同形,
  # 是为了需要容器化时形态一致(见 compose.yaml 的同名服务)。
  #
  # 配置只来自 infra/semantica/.env(独立文件,不含 Lucent 的 JWT_* / DATABASE_URL
  # / 微信密钥),模板见该目录 .env.example。
  semantica:
    image: ${SEMANTICA_IMAGE:-lucent-semantica:latest}
    container_name: lucent-semantica
    profiles: ['semantica']
    restart: unless-stopped
    env_file:
      - infra/semantica/.env
    environment:
      # 容器内访问图库:走 compose 服务名 `neo4j-dev`(服务名即可解析)。
      # 口令与 neo4j-dev 的 NEO4J_AUTH 一致,改一处要改两处。
      NEO4J_URI: bolt://neo4j-dev:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jdevpassword}
    depends_on:
      neo4j-dev:
        condition: service_healthy
    ports:
      # 只绑回环:Lucent 本地进程走 http://127.0.0.1:8099
      - '127.0.0.1:8099:8099'
    healthcheck:
      # /health 真借一条 Bolt 连接读图规模,图不可达时返回 503 → 探针如实失败。
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8099/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Jaeger (OpenTelemetry trace backend) ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: lucent-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP receiver

  # ── RustFS (dev S3-compatible object storage) ──────────────
  # 生产同一个镜像、同一份 compose 定义(compose.yaml 的 rustfs),这里只是把端口
  # 收紧到回环并给出 dev 凭据。tag 与生产**手工对齐**(两处都写死了 1.0.6)。
  #
  # 端口 9000(S3 API)/ 9001(Console)。宿主侧一律绑 127.0.0.1:凭据是容器内共享的,
  # 放开到 0.0.0.0 等于把存储面暴露到局域网。
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: lucent-rustfs
    restart: unless-stopped
    environment:
      # 单盘布局只能用**一个**卷:RustFS 启动时会校验每个卷的物理设备 id,
      # 多个卷落在同一块盘上直接 FATAL(`local erasure endpoints must use
      # distinct physical disks`)并进入崩溃循环。要多卷(纠删码冗余)必须给
      # 每个卷配独立物理盘,否则就保持单卷 —— 单卷不提供冗余。
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      # RustFS 不校验签名里的区域串(实测任意区域值都能通过),这里只用于对齐
      # 上报值;dev 与 .env.development 的 STORAGE_S3_REGION 保持一致即可。
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lucent-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lucent-dev-secret}
      RUSTFS_OBS_LOGGER_LEVEL: info
      # dev 不回连版本检查服务,减少离线开发时的启动噪声。
      RUSTFS_CHECK_UPDATE: 'false'
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Console
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 镜像自带 curl;S3 API 的 /health 是未鉴权探针(RUSTFS_HEALTH_ENDPOINT_ENABLE
      # 默认 true),比 console 端口更能代表"能接请求"。
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── RabbitMQ (dev 跨服务领域事件) ──────────────────────────
  # 与 redis 的分工见 .env.development.example:RabbitMQ 承担「事实/事件」的跨服务
  # 扇出，BullMQ 仍负责「命令/任务」。dev 只需要一个 broker，不配集群。
  #
  # 端口与其他 dev 服务(redis/postgres)一致映射到宿主,便于本机进程与容器内进程
  # 用同一套 `amqp://127.0.0.1:5672` 配置。
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lucent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lucent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lucent-dev-rabbit}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # `rabbitmq-diagnostics` 是镜像自带、不需要额外工具，且真正验证节点在跑
      # (不只是端口开着)。
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # ── rnacos（运行时配置中心；profile 内，默认不启动）──────────────
  # 承载「不重启进程可调参」的叠加层：环境变量仍是唯一基线，这里只发布非密钥
  # 热键（白名单见 docs/reference/runtime-config.example.txt）。默认服务列表不含
  # 它 —— 需要时显式带 profile：
  #   export RNACOS_CONSOLE_PASSWORD='...'   # 控制台口令，dev 也要显式给
  #   pnpm dev:stack rnacos
  #
  # 三个端口都是必需的：8848 HTTP（应用配这个，SDK 从它登录并自行连 9848）、
  # 9848 gRPC（长连接与推送）、10848 控制台（发配置的唯一入口）。
  # 生产同形部署在 compose.yaml；那边端口对宿主开放范围由安全组按来源 IP 收口，
  # 且必须开 `RNACOS_ENABLE_OPEN_API_AUTH=true`。dev 只绑回环、不开该开关，
  # 让本地发布文档少一步登录。
  #
  # 首次使用要先建 namespace 再发文档（rnacos 不会替你建；空 namespace 下
  # 客户端 getConfig 只会拿到「配置不存在」，表现为一直用 env 基线）：
  #   curl -sS -X POST 'http://127.0.0.1:8848/nacos/v1/console/namespaces' \
  #     -d 'customNamespaceId=lucent-dev&namespaceName=lucent-dev'
  #   curl -sS -X POST 'http://127.0.0.1:8848/nacos/v1/cs/configs' \
  #     --data-urlencode 'dataId=lucent-runtime-tuning.txt' \
  #     --data-urlencode 'group=LUCENT_RUNTIME' \
  #     --data-urlencode 'tenant=lucent-dev' \
  #     --data-urlencode 'type=text' \
  #     --data-urlencode 'content@docs/reference/runtime-config.example.txt'
  # 应用侧（.env.development）：RNACOS_ENABLED=true / RNACOS_SERVER_ADDR=127.0.0.1:8848
  # / RNACOS_NAMESPACE=lucent-dev / RNACOS_GROUP=LUCENT_RUNTIME + 控制台同源凭据。
  # 镜像拉不动时用镜像加速地址覆盖：
  #   export RNACOS_IMAGE=docker.m.daocloud.io/qingpan/rnacos:v0.8.7
  #
  # 客户端的磁盘缓存（`configLoadCacheAtStart`）与 SDK 日志落在进程的 HOME 下
  # （`~/nacos/config/<namespace>`、`~/logs/nacos/`）；dev 直接跑在宿主上，这两处
  # 自然持久，容器里部署时才需要挂卷（见 compose.yaml 的 app 服务）。
  rnacos:
    image: ${RNACOS_IMAGE:-qingpan/rnacos:v0.8.7}
    container_name: lucent-rnacos
    profiles: ['rnacos']
    restart: unless-stopped
    environment:
      RNACOS_INIT_ADMIN_USERNAME: ${RNACOS_CONSOLE_USER:-rnacos}
      # dev 默认值只在回环上成立；`pnpm dev:stack rnacos` 会在口令未显式给出时
      # 直接报错，生产 compose.yaml 的同名服务**不得**带默认值。
      RNACOS_INIT_ADMIN_PASSWORD: ${RNACOS_CONSOLE_PASSWORD:-rnacos-dev-only}
      # 控制台与我方的时区一致，便于对着发布时间排查。
      RNACOS_GMT_OFFSET_HOURS: '8'
    ports:
      - '127.0.0.1:8848:8848' # HTTP（应用配置项）
      - '127.0.0.1:9848:9848' # gRPC（SDK 长连接与推送）
      - '127.0.0.1:10848:10848' # 控制台（发布配置）
    volumes:
      - rnacos-data:/io
    healthcheck:
      # 镜像是 Debian 基底但无 curl/wget，用 bash 的 /dev/tcp 做纯 TCP 探活
      # （与适配器的探活同一思路，且不受 OpenAPI 鉴权开关影响）。
      test:
        [
          'CMD-SHELL',
          "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8848' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata-dev:
  pgdata-test:
  redisdata:
  rabbitmqdata:
  neo4j-dev-data:
  neo4j-dev-logs:
  rustfs-data:
  lightrag-data:
  rnacos-data:
