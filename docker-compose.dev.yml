services:
  # ── PostgreSQL 16 (development) ──────────────────────────────
  postgres-dev:
    image: postgres:16-alpine
    container_name: lucent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lucent
    ports:
      - '15432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL 16 (test / e2e) ───────────────────────────────
  postgres-test:
    image: postgres:16-alpine
    container_name: lucent-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: lucent_dev
      POSTGRES_DB: lucent
    ports:
      - '5432:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent -d lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lucent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
  pgdata-test:
  redisdata:
