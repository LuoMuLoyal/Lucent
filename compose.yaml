# Lucent Production / Staging Compose
# ---------------------------------------------------------------------------
# 本文件是仓库内唯一的生产/预发编排(事实源),在 Coolify 中被注册为
# Docker Compose Service,由 Coolify 在目标服务器上执行 `docker compose up`。
#
# 职责边界:
#   - 反向代理 / TLS / 域名路由 由 Coolify 自带 Traefik 接管(不再有 nginx、
#     check-cert.sh / certs 目录)。
#   - 应用镜像两条来源并存:
#       ① app 带 build 段 —— Coolify 直接在部署服务器上用仓库根 Dockerfile 构建;
#          构建产物打上 LUCENT_IMAGE 的完整引用(仓库代码不写死具体镜像地址)。
#       ② CI(lucent-production)构建并推送到发布者自有镜像仓库后,把
#          LUCENT_IMAGE 指到已推送的短 sha 引用即可拉取,不重新构建
#          (见 docs/reference/deployment.md)。
#   - 环境变量在 Coolify 面板维护(或本地 /opt/lucent/.env,见
#     docs/reference/deployment.md 与 .env.production.example)。compose 的
#     ${VAR} 插值与 app 的 env_file 都来自同一份变量源。
#   - 告警(vmalert/alertmanager/告警规则)与备份脚本已退役,当前不做配置。
#
# 端口映射说明:grafana / victoriametrics / victorialogs 直接发布宿主机端口,
# 公网访问由云厂商安全组收口(不再使用 SSH 隧道);app:3000 仅内网暴露,
# 公网入口只有 Coolify Traefik 路由的域名。

services:
  postgres:
    image: ${LUCENT_DB_IMAGE:?LUCENT_DB_IMAGE is required — full image ref, e.g. your-registry/lucent-db:18}
    restart: unless-stopped
    # 慢查询日志:超过 500ms 的语句写入容器日志(docker logs lucent-postgres)。
    command: ['postgres', '-c', 'log_min_duration_statement=500']
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: lucent
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # REDIS_PASSWORD 必须同时进容器环境:healthcheck 的 redis-cli 靠它认证
    # (只写在 command 的 --requirepass 里,容器内环境变量为空 → 健康检查永远失败,
    #  而 app 的 depends_on: service_healthy 会因此永远等不到 redis 就绪)。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── App(单 slot,由 Coolify/Traefik 提供公网入口)──────────────
  # 两种发布方式:
  #   - 服务器构建:`docker compose up -d --build app`(Coolify 也走这条),
  #     用仓库根 Dockerfile 就地构建,构建产物即 LUCENT_IMAGE 引用。
  #   - 拉取 CI 镜像:先 `docker compose pull app`,再 up;LUCENT_IMAGE 指向
  #     CI 推送的短 sha 引用时不会触发构建。
  # 详见 docs/howto/deploy.md。日志只写 stdout(Coolify 收集)+ VictoriaLogs,
  # 不再挂载日志卷。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LUCENT_IMAGE:?LUCENT_IMAGE is required — full image ref, e.g. your-dockerhub-user/lucent:1a2b3c4d}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lucent:${POSTGRES_PASSWORD}@postgres:5432/lucent?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY: 'true'
      METRICS_USER: ${METRICS_USER}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      # JPush 推送密钥经环境变量注入(缺失时服务静默禁用推送并启动 warn)。
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_APNS_PRODUCTION: ${JPUSH_APNS_PRODUCTION:-false}
      VICTORIALOGS_URL: http://victorialogs:9428/insert/jsonline
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SIGTERM 后给应用 60s 排空:SSE 注册表会先推终止事件再关闭连接,
    # BullMQ worker 等进行中任务收尾(见 src/common/api/sse-connection-registry.service.ts)。
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── LightRAG(中文散文检索 sidecar)────────────────────────────
  # 说明书字段级语义检索 + 医学问答的导入与查询都由它承担(app 侧只调 /query)。
  # 只 expose 给 app 走容器网络,不发布宿主机端口、不挂 Traefik —— 唯一调用方是
  # Lucent 内网。
  #
  # 配置来自独立文件 deploy/lightrag/.env(见 deploy/lightrag/.env.example 的清单),
  # 与 app 的 .env **不共用**:那是独立进程、独立 image、独立升级周期,不该读到
  # JWT_* / DATABASE_URL / 微信密钥。部署平台需给该服务单独注入同一份内容。
  #
  # 存储四件套(PGKVStorage / PGVectorStorage / PGTableGraphStorage /
  # PGDocStatusStorage)在 sidecar env 里选定:纯 SQL 表,不需要 AGE,也不需要
  # 新数据库服务;它们落在同一 PG 的独立 database(lightrag),不进 Prisma 迁移域。
  lightrag:
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:latest}
    restart: unless-stopped
    env_file:
      - deploy/lightrag/.env
    environment:
      # 同一 compose 网络 → 走服务名;database 独立于 lucent。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # 领域本体 prompt profile 的根目录；ENTITY_TYPE_PROMPT_FILE 相对它解析。
      PROMPT_DIR: /app/data/prompts
    volumes:
      - lightrag-data:/app/data
      # 只读挂载：prompt 是配置事实源，需随镜像一起评审与回滚。
      - ./deploy/lightrag/prompts:/app/data/prompts:ro
    expose:
      - '9621'
    depends_on:
      postgres:
        condition: service_healthy
    # 升级流程要求排空 pipeline 后停所有 writer 再启新版本(v1.5.7 起并发协议变更
    # 且无版本标记,漏一个旧 writer 即损坏数据)——给足排空时间,不用默认 10s。
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9621/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Semantica(英文侧 OAG sidecar)─────────────────────────────
  # 本体推理:只读 Cypher 的校验 + 执行、SHACL 校验与 Datalog 推理。图是 DrugBank
  # 结构化字段的确定性灌入(零 LLM 抽取),**服务不持有模型凭据** —— NL→Cypher 的
  # 生成在 Lucent 侧用 AI_LANGUAGE_* 完成,因此两边也没有共享密钥要同步
  # (sidecar 不鉴权:只 expose 给 app 走容器网络,不发布宿主端口、不挂 Traefik)。
  #
  # 配置来自独立文件 deploy/semantica/.env(模板见该目录 .env.example),与 app 的
  # .env **不共用**:那是独立进程、独立镜像、独立升级周期,不该读到 JWT_* /
  # DATABASE_URL / 微信密钥。其中 AGE_DSN 按环境填(含口令,不入库),图在独立
  # database `lucent_graph` 中,不进 Prisma 迁移域。
  #
  # profile 门控:镜像尚未提供(semantica-service 仓还没有 Dockerfile),不加 profile
  # 会让 `docker compose up` 去拉一个不存在的镜像而失败。
  semantica:
    image: ${SEMANTICA_IMAGE:-lucent-semantica:latest}
    profiles: ['semantica']
    restart: unless-stopped
    env_file:
      - deploy/semantica/.env
    environment:
      # 同一 compose 网络 → 走服务名;database 独立于 lucent。
      GRAPH_NAME: lucent_graph
    expose:
      - '8099'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health 真借一条 AGE 连接读图规模,图不可达时返回 503 → 探针如实失败。
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8099/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── VictoriaMetrics(单机时序库,供 Grafana 查询) ──────────────
  # 抓取 lucent app /metrics 与 node-exporter;Basic Auth 凭据经环境变量
  # %{METRICS_USER}/%{METRICS_PASSWORD} 占位符注入(无需渲染脚本)。
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: unless-stopped
    ports:
      # VMUI / 查询接口,公网访问由云安全组收口
      - '8428:8428'
    volumes:
      - ./monitoring/victoriametrics/vmscraper.yml:/etc/vmscraper.yml:ro
      - victoriametrics-data:/storage
    environment:
      METRICS_USER: ${METRICS_USER}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=0.0.0.0:8428'
      # 抓取配置:不传这个参数时 VictoriaMetrics 不会加载 /etc/vmscraper.yml
      # (卷挂了文件也没用),app 与 node-exporter 的指标会一直是空的。
      - '-promscrape.config=/etc/vmscraper.yml'
    depends_on:
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      # Grafana UI,公网访问由云安全组收口
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/opt/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── VictoriaLogs(日志库,app 的 VICTORIALOGS_URL 直推) ────────
  # Web UI 通过发布端口访问(安全组收口);应用日志同时进 stdout 由容器收集。
  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0
    restart: unless-stopped
    ports:
      - '9428:9428'
    volumes:
      - victorialogs-data:/storage
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=0.0.0.0:9428'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # node-exporter 走 bridge 网络,network 指标只反映容器 netns(已知取舍,
  # 不换 host 网络是为了不把 9100 端口暴露到宿主机网卡);CPU/内存/磁盘
  # 指标均来自挂载的宿主机 /proc、/sys、/,不受影响。
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  postgres-data:
  redis-data:
  victoriametrics-data:
  grafana-data:
  victorialogs-data:
  lightrag-data:
