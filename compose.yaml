# Lucent Production / Staging Compose
# ---------------------------------------------------------------------------
# 本文件是仓库内唯一的生产/预发编排(事实源),在 Coolify 中被注册为
# Docker Compose Service,由 Coolify 在目标服务器上执行 `docker compose up`。
#
# 职责边界:
#   - 反向代理 / TLS / 域名路由 由 Coolify 自带 Traefik 接管(不再有 nginx、
#     check-cert.sh / certs 目录)。
#   - 应用镜像两条来源并存:
#       ① app 带 build 段 —— Coolify 直接在部署服务器上用仓库根 Dockerfile 构建;
#          构建产物打上 LUCENT_IMAGE 的完整引用(仓库代码不写死具体镜像地址)。
#       ② CI(lucent-production)构建并推送到发布者自有镜像仓库后,把
#          LUCENT_IMAGE 指到已推送的短 sha 引用即可拉取,不重新构建
#          (见 docs/reference/deployment.md)。
#   - 环境变量在 Coolify 面板维护(或本地 /opt/lucent/.env,见
#     docs/reference/deployment.md 与 .env.production.example)。compose 的
#     ${VAR} 插值与 app 的 env_file 都来自同一份变量源。
#   - 告警(vmalert/alertmanager/告警规则)与备份脚本已退役,当前不做配置。
#
# 端口映射说明:**当前为比赛期,所有服务端口都直接发布到宿主机**,由云厂商
# 安全组收口(不依赖 SSH 隧道)。本文件覆盖鲲鹏的 app/postgres/redis/lightrag/
# neo4j/semantica/node-exporter;监控栈的 grafana/victoriametrics/victorialogs
# 在阿里云那台,端口见 compose.monitoring.yaml。见 docs/TODO.md 的"比赛期临时
# 发布端口"条目 —— 正式生产必须收回其中的 postgres / redis / neo4j / lightrag /
# semantica / node-exporter。
#
# 为什么比赛期要全开:可调试性是当前第一优先级 —— 能直连数据库看数据、能直接
# 打 sidecar 的 /schema 看图谱形态,比"最小暴露面"重要得多。安全组按来源 IP
# 白名单收口。
#
# 正式生产的姿态应是:app:3000 仅内网暴露、公网入口只走 Traefik 域名,其余一律
# 只 expose 给容器网络;监控栈按其自己的文件部署并经安全组收口。
#
# 跨机引用:node-exporter(本文件)与阿里云的 VictoriaMetrics(其对侧文件)之间
# 靠公网抓取打通 —— 阿里云抓 `LUCENT_PUBLIC_HOST:9100` 与 `:3000`,安全组只放行
# 阿里云的出口 IP。两家云的 VPC 不互通,不要填内网地址。

services:
  postgres:
    image: ${LUCENT_DB_IMAGE:?LUCENT_DB_IMAGE is required — full image ref, e.g. your-registry/lucent-db:18}
    restart: unless-stopped
    # 慢查询日志:超过 500ms 的语句写入容器日志(docker logs lucent-postgres)。
    command: ['postgres', '-c', 'log_min_duration_statement=500']
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: lucent
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      # 比赛期:直连数据库查数据。正式生产应删除(见文件头)。
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # REDIS_PASSWORD 必须同时进容器环境:healthcheck 的 redis-cli 靠它认证
    # (只写在 command 的 --requirepass 里,容器内环境变量为空 → 健康检查永远失败,
    #  而 app 的 depends_on: service_healthy 会因此永远等不到 redis 就绪)。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      # 比赛期:直连 Redis 查队列/缓存。正式生产应删除(见文件头)。
      - '6379:6379'
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── App(单 slot,由 Coolify/Traefik 提供公网入口)──────────────
  # 两种发布方式:
  #   - 服务器构建:`docker compose up -d --build app`(Coolify 也走这条),
  #     用仓库根 Dockerfile 就地构建,构建产物即 LUCENT_IMAGE 引用。
  #   - 拉取 CI 镜像:先 `docker compose pull app`,再 up;LUCENT_IMAGE 指向
  #     CI 推送的短 sha 引用时不会触发构建。
  # 详见 docs/howto/deploy.md。日志只写 stdout(Coolify 收集)+ VictoriaLogs,
  # 不再挂载日志卷。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LUCENT_IMAGE:?LUCENT_IMAGE is required — full image ref, e.g. your-dockerhub-user/lucent:1a2b3c4d}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lucent:${POSTGRES_PASSWORD}@postgres:5432/lucent?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY: 'true'
      METRICS_USER: ${METRICS_USER}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      # JPush 推送密钥经环境变量注入(缺失时服务静默禁用推送并启动 warn)。
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_APNS_PRODUCTION: ${JPUSH_APNS_PRODUCTION:-false}
      # 监控栈搬到阿里云后,容器名 `victorialogs` 在鲲鹏上解析不了 —— 跨云部署
      # 须在 .env 里覆盖成本机的公网地址(http://<阿里云公网IP>:9428/insert/jsonline)。
      # 默认值保留容器名,供单机全栈部署使用。
      VICTORIALOGS_URL: ${VICTORIALOGS_URL:-http://victorialogs:9428/insert/jsonline}
    expose:
      - '3000'
    ports:
      # 比赛期:绕开 Traefik 直连 app,便于用 curl/Postman 打接口与看健康检查。
      # 正式生产应删除,只保留上面的 expose(公网入口走 Traefik 域名)。
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SIGTERM 后给应用 60s 排空:SSE 注册表会先推终止事件再关闭连接,
    # BullMQ worker 等进行中任务收尾(见 src/common/api/sse-connection-registry.service.ts)。
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── LightRAG(中文散文检索 sidecar)────────────────────────────
  # 说明书字段级语义检索 + 医学问答的导入与查询都由它承担(app 侧只调 /query)。
  # 只 expose 给 app 走容器网络,不发布宿主机端口、不挂 Traefik —— 唯一调用方是
  # Lucent 内网。
  #
  # 配置来自独立文件 deploy/lightrag/.env(见 deploy/lightrag/.env.example 的清单),
  # 与 app 的 .env **不共用**:那是独立进程、独立 image、独立升级周期,不该读到
  # JWT_* / DATABASE_URL / 微信密钥。部署平台需给该服务单独注入同一份内容。
  #
  # 存储四件套(PGKVStorage / PGVectorStorage / PGTableGraphStorage /
  # PGDocStatusStorage)在 sidecar env 里选定:纯 SQL 表,不需要 AGE,也不需要
  # 新数据库服务;它们落在同一 PG 的独立 database(lightrag),不进 Prisma 迁移域。
  lightrag:
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:latest}
    restart: unless-stopped
    env_file:
      - deploy/lightrag/.env
    environment:
      # 同一 compose 网络 → 走服务名;database 独立于 lucent。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # 领域本体 prompt profile 的根目录；ENTITY_TYPE_PROMPT_FILE 相对它解析。
      PROMPT_DIR: /app/data/prompts
    volumes:
      - lightrag-data:/app/data
      # 只读挂载：prompt 是配置事实源，需随镜像一起评审与回滚。
      - ./deploy/lightrag/prompts:/app/data/prompts:ro
    expose:
      - '9621'
    ports:
      # 比赛期:直连 LightRAG 调试检索与建图。正式生产应删除(见文件头)。
      - '9621:9621'
    depends_on:
      postgres:
        condition: service_healthy
    # 升级流程要求排空 pipeline 后停所有 writer 再启新版本(v1.5.7 起并发协议变更
    # 且无版本标记,漏一个旧 writer 即损坏数据)——给足排空时间,不用默认 10s。
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9621/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Neo4j(英文侧 OAG 的图后端)───────────────────────────────
  # semantica-service 经 Bolt 访问它;Lucent 从不直连。只 expose 给同网络的
  # sidecar,不发布宿主端口、不挂 Traefik。
  #
  # 内存显式封顶,勿依赖默认(约 1.5 GiB)。heap 512m + pagecache 256m 是实测
  # 基线 —— 本图 RSS 1,243 MiB。pagecache 固定上限正是选它的理由:
  # **数据增长不会线性吃内存**。
  #
  # ⚠️ 除 NEO4J_AUTH 外,任何 `NEO4J_` 前缀变量都被当作配置键解析,未声明的键
  # 会让容器**拒绝启动**(实测 `server.memory.recovery_policy` 在 5.26 不存在)。
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.31-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # healthcheck 用:非 NEO4J_ 前缀,否则会被解析成 `server.password` 而报错。
      LUCENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    expose:
      - '7687'
    ports:
      # 比赛期:7687 直连 Bolt(cypher-shell / Neo4j Browser 驱动),
      # 7474 是 Browser UI,核对图谱内容最直观的两个入口。
      # 正式生产应全部删除:只有同机的 semantica 需要 7687,走容器网络即可。
      #
      # ⚠️ 生产事故的现成配方:Neo4j 端口一旦公网可达,口令就是唯一防线
      # (NEO4J_AUTH),而它按设计是要被 sidecar 读到的。
      - '7687:7687'
      - '7474:7474'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Bolt 握手不靠 HTTP,而 HTTP 端点在恢复期就已监听 —— 用后者当探针会在
      # 数据库真正可用之前报健康。cypher-shell 会真的建会话并查询。
      test:
        [
          'CMD-SHELL',
          'cypher-shell -u neo4j -p "$$LUCENT_NEO4J_PASSWORD" "RETURN 1" >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Semantica(英文侧 OAG sidecar)─────────────────────────────
  # 本体推理:只读 Cypher 的校验 + 执行、SHACL 校验与规则推理。图是 DrugBank
  # 结构化字段的确定性灌入(零 LLM 抽取),**服务不持有模型凭据** —— NL→Cypher 的
  # 生成在 Lucent 侧用 AI_LANGUAGE_* 完成。
  #
  # 两侧共享一个值:API_TOKEN(sidecar 侧)/ SEMANTICA_API_KEY(app 侧),除
  # /health 外每个端点都校验它。早期版本刻意不带凭据,因为当时只走容器网络、
  # 不发布宿主端口;跨云部署后该前提消失(见下面的 ports 注释)。
  #
  # 配置来自独立文件 deploy/semantica/.env(模板见该目录 .env.example),与 app 的
  # .env **不共用**:那是独立进程、独立镜像、独立升级周期,不该读到 JWT_* /
  # DATABASE_URL / 微信密钥。其中 NEO4J_* 按环境填(含口令,不入库),图在
  # Neo4j 中,**完全不进 Prisma 的 Postgres 域**。
  #
  # profile 门控:该镜像需要构建/搬运(semantica-service 仓已有 Dockerfile,
  # 但依赖里有 git 依赖,服务器无外网时构建会失败 —— 须在有网机器上
  # `docker build` 后 `docker save` 搬运),不加 profile 会让
  # `docker compose up` 去拉一个不存在的镜像而失败。
  semantica:
    image: ${SEMANTICA_IMAGE:-lucent-semantica:latest}
    profiles: ['semantica']
    restart: unless-stopped
    env_file:
      - deploy/semantica/.env
    environment:
      # 同一 compose 网络 → 走服务名;库独立于 lucent 的 Postgres。
      NEO4J_URI: bolt://neo4j:7687
    expose:
      - '8099'
    ports:
      # 比赛期:跨云部署的必要项 —— app 在另一台机器上,容器网络到不了这里的
      # expose。直连还能用 curl 打 /schema、/rules 看图谱形态。
      # 正式生产若仍跨云,这一条要保留;若同机则应删除,改回只 expose。
      #
      # 鉴权已经就位(API_TOKEN,见 deploy/semantica/.env.example),所以这是
      # "发布端口 + bearer 鉴权"而不是"发布端口 + 裸奔"。
      - '8099:8099'
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # /health 真借一条 Bolt 连接读图规模,图不可达时返回 503 → 探针如实失败。
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8099/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── node-exporter(唯一留在鲲鹏的监控组件) ────────────────────
  # VictoriaMetrics / Grafana / VictoriaLogs 已搬到阿里云那台(见
  # compose.monitoring.yaml):Grafana 查询 VM 是密集链路,若两者分处两机就会让
  # 同一份数据在公网上往返两次。node-exporter 不能走 —— 它必须采集**本机**
  # 宿主机的 /proc、/sys、/,搬到别处就只是在采集那台的指标。
  #
  # 它走 bridge 网络,network 指标只反映容器 netns(已知取舍;CPU/内存/磁盘指标
  # 均来自挂载的宿主机 /proc、/sys、/,不受影响)。
  #
  # 注意:它没有换成 host 网络 —— 换了才能拿到宿主机真实的网络指标,但那是另一个
  # 取舍,与下面 9100 是否发布无关。
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    ports:
      # 比赛期:阿里云那台的 VictoriaMetrics 要经公网抓它,所以必须发布。
      # 正式生产应改为只让安全组放行阿里云出口 IP,并考虑收回端口(见文件头)。
      - '9100:9100'
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  postgres-data:
  redis-data:
  # 图数据与日志分开:日志会持续增长,备份/清理的节奏与数据不同。
  neo4j-data:
  neo4j-logs:
  # victoriametrics-data / grafana-data / victorialogs-data 已随服务搬到
  # compose.monitoring.yaml(阿里云那台),不再属于本文件的卷。
  lightrag-data:
