# Lucent Compose — 主站(华为云 鲲鹏)
# ---------------------------------------------------------------------------
# 本文件**只描述主站**:app 与它自己的数据/检索依赖。图库机(Neo4j + semantica)
# 在 `compose.graph.yaml`,监控机在 `compose.monitoring.yaml` —— 三份各跑一台,
# 用**文件名**就能判断该起哪些服务,不需要再靠显式服务名或 profile 去挑。
# 三台机器的角色与链路见 docs/reference/deployment.md,操作步骤见 docs/howto/deploy.md。
#
# 为什么一台一份文件(而不是一份文件两处部署):
#   主站起 postgres/redis/app/lightrag/node-exporter,图库机起 neo4j/semantica,
#   服务集完全不相交。挤在一个文件里时,每台机器都要凑齐**另一台**的必填变量
#   才能让 compose 完成插值 —— 图库机原本要填 LUCENT_IMAGE / LUCENT_DB_IMAGE /
#   POSTGRES_PASSWORD / REDIS_PASSWORD,而那正是主站的生产口令。
#   分开后每台只读自己那份 `.env`,口令不必跨机器复制,同步单位也从"两台机的并集"
#   缩到"一台机"。
#
# 职责边界:
#   - **无反向代理、无域名、无 TLS**:app 直接发布 3000,入口是 HTTP。
#     (ADR-0017 的 Coolify + 自带 Traefik 模型已由 ADR-0023 取代并退役。)
#   - 应用镜像两条来源并存:
#       ① CI(`release.yml`)构建 multi-arch(amd64+arm64)并推送到发布者自有镜像仓库,
#          把 LUCENT_IMAGE 指到 `sha-<短sha>` 即可拉取,Docker 按本机架构自动选层。
#          常规走这条。
#       ② app 带 build 段 —— 就地用仓库根 Dockerfile 构建(镜像仓库不可用时的替代,
#          只适用本机原生架构)。
#   - 环境变量是服务器上的 `.env`(不入库,模板 `.env.production.example`)。compose 的
#     ${VAR} 插值与 app 的 env_file 都来自同一份变量源。
#   - 告警已配置(Grafana 统一告警,规则在监控机那台的 compose.monitoring.yaml);
#     自动备份当前未配置。
#
# 端口与暴露面:**端口发布到 0.0.0.0 不等于对全网开放** —— 可达范围由云安全组的
# 来源 IP 白名单决定(把端口限定到指定 IP 后,等同于"只有该 IP 能连")。因此判断
# 暴露面看**安全组放行了谁**,不看端口是否发布。真实 IP 与规则清单属运维信息,
# 在服务器侧与私有笔记维护,**不入库**。原则:
#   - node-exporter(9100)**绝不放行 0.0.0.0/0**(无内建鉴权),只放行监控机出口 IP;
#   - 数据与 sidecar 端口(5432/6379/9621)只放行运维 IP
#     与确实需要对端的来源 IP;
#   - 更严的做法是开 SSH 隧道,那时端口不必对任何 IP 放行。
#
# 跨机引用:监控机(阿里云)的 VictoriaMetrics 抓本文件的 node-exporter(9100)与
# app 的 /metrics(3000);主站 app 反向推日志/追踪到监控机的 9428/10428,
# 并调用图库机的 semantica(8099)。三家云之间**没有 VPC 对等**,私网网段互不可达,
# 所以跨机地址必须填**对方公网地址**,安全组按对方出口 IP 白名单
# (三家均 1:1 NAT,出口 IP == 公网 IP)。填内网地址的失败形态是**超时**。

services:
  postgres:
    image: ${LUCENT_DB_IMAGE:?LUCENT_DB_IMAGE is required — full image ref, e.g. your-registry/lucent-db:pg18-20261005-1a2b3c4d}
    restart: unless-stopped
    # 慢查询日志:超过 500ms 的语句写入容器日志(docker logs lucent-postgres)。
    command: ['postgres', '-c', 'log_min_duration_statement=500']
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: lucent
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      # 发布到宿主便于运维直连查数据;安全组只放行运维 IP(见文件头)。
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # REDIS_PASSWORD 必须同时进容器环境:healthcheck 的 redis-cli 靠它认证
    # (只写在 command 的 --requirepass 里,容器内环境变量为空 → 健康检查永远失败,
    #  而 app 的 depends_on: service_healthy 会因此永远等不到 redis 就绪)。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      # 发布到宿主便于运维直连查队列/缓存;安全组只放行运维 IP(见文件头)。
      - '6379:6379'
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── App(单 slot,直接对外提供 HTTP 入口)─────────────────────────
  # 两种发布方式:
  #   - 服务器构建:`docker compose up -d --build app`,
  #     用仓库根 Dockerfile 就地构建,构建产物即 LUCENT_IMAGE 引用。
  #   - 拉取 CI 镜像:先 `docker compose pull app`,再 up;LUCENT_IMAGE 指向
  #     CI 推的 `sha-<短sha>` 引用时不会触发构建。常规走这条。
  # 详见 docs/howto/deploy.md。日志只写 stdout(容器收集)+ VictoriaLogs,
  # 不再挂载日志卷。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LUCENT_IMAGE:?LUCENT_IMAGE is required — full image ref, e.g. your-dockerhub-user/lucent:sha-1a2b3c4d}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lucent:${POSTGRES_PASSWORD}@postgres:5432/lucent?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # ⚠️ 当前拓扑无反代,默认 false:trusting X-Forwarded-* 会让客户端
      # 伪造 XFF 绕过按 IP 的限流。接入反代后再在 .env 里设为 true。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      METRICS_USER: ${METRICS_USER}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      # JPush 推送密钥经环境变量注入(缺失时服务静默禁用推送并启动 warn)。
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_APNS_PRODUCTION: ${JPUSH_APNS_PRODUCTION:-false}
      # 监控栈在另一台机器上,容器名 `victorialogs` 在主站解析不了 —— 跨云部署
      # 须在 .env 里覆盖成监控机的公网地址(http://<监控机IP>:9428/insert/jsonline)。
      # 默认值保留容器名,供单机全栈部署使用。
      VICTORIALOGS_URL: ${VICTORIALOGS_URL:-http://victorialogs:9428/insert/jsonline}
      # 配置中心 SDK 的客户端日志:默认 INFO 明显偏吵(实测 2 分钟 56KB),压到 ERROR。
      # 这不属于 app 的 .env 白名单,只是 SDK 自己读的环境变量,由这里注入。
      NACOS_CLIENT_LOGGER_LEVEL: ERROR
    volumes:
      # 冷启动策略依赖这两处持久化:rnacos 不可达时 getConfig 会交回磁盘上的
      # 上一份文档(~HOME/nacos/config/<namespace>);SDK 日志(~HOME/logs/nacos)
      # 不落卷则每次重建都丢,排查时无从对照。
      #
      # ⚠️ 属主:这两个目录由镜像预建并归 `lucent` 用户,命名卷首次创建时继承该属主。
      #    若卷已经以 root 创建(存量机器,或未重建镜像就启用 rnacos),非 root 的
      #    Rust SDK 写日志会 panic 并使容器崩溃循环 —— 先按 docs/howto/deploy.md
      #    「启用 rnacos 前的卷属主修复」一次性 chown。
      - nacos-client-cache:/home/lucent/nacos
      - nacos-client-logs:/home/lucent/logs/nacos
    expose:
      - '3000'
    ports:
      # 公网入口;可达范围由安全组按来源 IP 收口(见文件头)。
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SIGTERM 后给应用 60s 排空:SSE 注册表会先推终止事件再关闭连接,
    # BullMQ worker 等进行中任务收尾(见 src/common/api/sse-connection-registry.service.ts)。
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── RabbitMQ(跨服务领域事件)─────────────────────────────────
  # 与 redis 的分工:BullMQ 走 Redis 承担「命令/任务」(恰好一个执行者);
  # RabbitMQ 承担「事实/事件」的跨服务扇出(0..N 个订阅者,可回放)。
  #
  # 端口必须发布到 0.0.0.0:消费者将来跑在**其他主机**上,要靠公网连过来。
  # 可达范围按文件头的原则由安全组收口 —— 只放行确实需要发布/订阅的服务出口 IP,
  # 15672 管理台尤其不能对全网开放(它握有 broker 全部权限的登录入口)。
  # 未配置 TLS 时 AMQP 明文传输,链路加密是后续项(见 docs/TODO.md)。
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      # 不给默认值:broker 的口令泄露等于所有事件都能被伪造或窃取。
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - '5672:5672' # AMQP(跨服务事件,安全组按来源 IP 收口)
      - '15672:15672' # Management UI ⚠️ 只放行运维 IP
    healthcheck:
      # 镜像自带 `rabbitmq-diagnostics`,真正验证节点在跑而不只是端口开着。
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── RustFS(自建对象存储,S3 兼容)─────────────────────────────
  # 取代原有的托管存储(七牛云 Kodo)与 dev 的 SeaweedFS:同一份定义同时服务
  # 生产与 dev(compose.dev.yaml 只是收紧端口、换 dev 凭据)。
  #
  # 拓扑:app 走容器网络访问 `rustfs:9000`;客户端直传 / 外部受众(识图模型)
  # 也签名到同一端点 —— 那两路需要从**公网**经 IP:9000 访问,因此端口必须发布,
  # 且路径式寻址(见下)。没有域名与 TLS 时的取舍见
  # docs/reference/environment-variables.md 的对象存储小节。
  #
  # 端口与暴露面依据文件头的同一原则:9000 由安全组收口,9001(管理控制台)
  # **绝不放行 0.0.0.0/0** —— 它握有根凭据登录入口,只放行运维 IP。
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      # ⚠️ 单盘只能配**一个**卷。RustFS 启动时校验各卷的物理设备 id,多个卷落在
      # 同一块盘上会 FATAL(`local erasure endpoints must use distinct physical
      # disks`)并崩溃循环 —— 不是"没冗余"的软失败,是起不来。
      # 要冗余:给 RustFS 挂 4 个独立物理盘并为每个盘加一个卷,再把这里改成
      # `/data/rustfs{0...3}`(配合 4 个 volume 映射)。
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      # RustFS 不校验 SigV4 签名里的区域串(实测 z2 / cn-north-1 / 任意串都能通过),
      # 它只校验凭据与签名本身。因此这里的值不参与鉴权,只作为服务端上报的区域;
      # 仍建议与 app 的 STORAGE_S3_REGION 保持一致,免得将来接 CDN 或换回托管
      # 存储时,"改了区域也不报错"的历史配置变成新的静默故障。
      RUSTFS_REGION: ${RUSTFS_REGION:?RUSTFS_REGION is required}
      # 不给默认值:镜像内建的 rustfsadmin/rustfsadmin 是公开值,缺变量即拒绝启动。
      RUSTFS_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY is required}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - rustfs-data:/data
    ports:
      - '9000:9000' # S3 API(客户端直传与外部受众访问的入口,安全组收口)
      - '9001:9001' # Console ⚠️ 只放行运维 IP
    # app 不 depends_on 它:存储不可用时 app 仍要能起来并把问题报成
    # DEPENDENCY_UNAVAILABLE,而不是跟着卡在启动。
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── LightRAG(中文散文检索 sidecar)────────────────────────────
  # 说明书字段级语义检索 + 医学问答的导入与查询都由它承担(app 侧只调 /query)。
  # 只 expose 给 app 走容器网络,不发布宿主机端口、不挂 Traefik —— 唯一调用方是
  # Lucent 内网。
  #
  # 配置来自独立文件 infra/lightrag/.env(见 infra/lightrag/.env.example 的清单),
  # 与 app 的 .env **不共用**:那是独立进程、独立 image、独立升级周期,不该读到
  # JWT_* / DATABASE_URL / 微信密钥。部署平台需给该服务单独注入同一份内容。
  #
  # 存储四件套(PGKVStorage / PGVectorStorage / PGTableGraphStorage /
  # PGDocStatusStorage)在 sidecar env 里选定:纯 SQL 表,不需要 AGE,也不需要
  # 新数据库服务;它们落在同一 PG 的独立 database(lightrag),不进 Prisma 迁移域。
  lightrag:
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:latest}
    restart: unless-stopped
    env_file:
      - infra/lightrag/.env
    environment:
      # 同一 compose 网络 → 走服务名;database 独立于 lucent。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # 领域本体 prompt profile 的根目录；ENTITY_TYPE_PROMPT_FILE 相对它解析。
      PROMPT_DIR: /app/data/prompts
    volumes:
      - lightrag-data:/app/data
      # 只读挂载：prompt 是配置事实源，需随镜像一起评审与回滚。
      - ./infra/lightrag/prompts:/app/data/prompts:ro
    expose:
      - '9621'
    ports:
      # 发布到宿主便于直连调试检索与建图;安全组只放行运维 IP(见文件头)。
      - '9621:9621'
    depends_on:
      postgres:
        condition: service_healthy
    # 升级流程要求排空 pipeline 后停所有 writer 再启新版本(v1.5.7 起并发协议变更
    # 且无版本标记,漏一个旧 writer 即损坏数据)——给足排空时间,不用默认 10s。
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:9621/health\").read()" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Mem0 self-hosted server（长期记忆）──────────────────────────
  # 与 lightrag 同一处置：**不**自带 Postgres，复用同 compose 的 `postgres`
  # （走服务名），但落在独立 database（`mem0` 记忆表 + `mem0_app` 元数据）。
  # 它自己的 `users` 表与 Prisma 的 `User` 同名，同库必然撞名。
  #
  # 配置只来自 infra/mem0/.env（模板见该目录 .env.example），不含 Lucent 的
  # JWT_* / DATABASE_URL / 微信密钥。
  #
  # 不发布端口到宿主：只有 app 需要调它，走 compose 内部网络即可。
  # dashboard 不在此文件——生产不需要一个能浏览用户记忆的 Web 面，
  # 需要时走 SSH 隧道临时起，别把它常驻在公网机器的 compose 里。
  mem0:
    # 官方 `mem0/mem0-api-server` 只有 arm64，amd64 宿主拉不下来（实测
    # `no matching manifest for linux/amd64`）。这个镜像是官方 `server/` 源码的
    # amd64 重建，已验证能起到 healthy。社区维护，故 pin digest 而非 latest：
    # 它持有 JWT_SECRET 与数据库口令，镜像内容变更必须是显式动作。
    image: ${MEM0_IMAGE:-amerenda/mem0-server@sha256:7d3dd4e35f893ed9aa6a4b6adbe2b7bcb05bf801737e383b7b43cd5b9521089d}
    restart: unless-stopped
    env_file:
      - infra/mem0/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      # 遥测默认关闭：它会向 Mem0 上报 install UUID 与邮件域。
      MEM0_TELEMETRY: 'false'
      DASHBOARD_URL: ${MEM0_DASHBOARD_URL:-http://127.0.0.1:3080}
    expose:
      - '8000'
    ports:
      # 发布到宿主，与 lightrag / rnacos 同一处置：可达范围由安全组按来源收口
      # （见 docs/TODO.md「端口暴露面」）。app 走 compose 服务名 `mem0:8000`，
      # 这条发布只给运维直连排障用。⚠️ 无内建 TLS，别跨公网调用。
      - '8888:8000'
    volumes:
      # history 是容器内 SQLite（默认 /app/history/history.db），不在 Postgres
      # 里。不挂卷则首次启动 `unable to open database file`，重建还丢变更历史。
      - mem0-history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [
          'CMD-SHELL',
          # 没有 `/health` 端点（实测 404）。`/docs` 是 FastAPI 自带的 OpenAPI
          # 页面，不需要鉴权，且只有应用真正完成 startup 才会 200。
          'python -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8000/docs\")" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      # Alembic 首启要建表，慢机器上给足启动窗口。
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── rnacos(运行时配置中心)──────────────────────────────────────
  # 环境变量仍是唯一基线,rnacos 只是叠在它之上的可热更新层:这里发布的文档只能是
  # 非密钥热键(白名单见 docs/reference/runtime-config.example.txt),密钥与连接串
  # 一律留在 .env。**不给 app 加 depends_on** —— 中心不是启动依赖,它不在线时 app
  # 照常起来并沿用 env 基线(代价:启动会等 SDK 的阻塞构造,见
  # docs/reference/environment-variables.md 的启动耗时标定)。
  #
  # 三个端口都必须发布:8848 HTTP(app 的 RNACOS_SERVER_ADDR 配这个)、9848 gRPC
  # (SDK 从 8848 登录后自行连 +1000)、10848 控制台(发布文档的唯一入口)。
  # ⚠️ 安全组只放行受信来源;控制台口令不允许留默认值(缺变量即拒绝启动)。
  #
  # 控制台不预建 namespace:首次启用前要在控制台建好与 app 的 RNACOS_NAMESPACE
  # 同名的空间并发布文档,否则 app 只会读到「配置不存在」而一直用 env 基线。
  rnacos:
    image: ${RNACOS_IMAGE:?RNACOS_IMAGE is required — pin a version, e.g. qingpan/rnacos:v0.8.7}
    restart: unless-stopped
    environment:
      RNACOS_INIT_ADMIN_USERNAME: ${RNACOS_CONSOLE_USER:-rnacos}
      RNACOS_INIT_ADMIN_PASSWORD: ${RNACOS_CONSOLE_PASSWORD:?RNACOS_CONSOLE_PASSWORD is required}
      RNACOS_GMT_OFFSET_HOURS: '8'
      # 与 app 的 RNACOS_USERNAME / RNACOS_PASSWORD 同源。开了它之后
      # /nacos/v1/console/health/readiness 需要 token,探针不能依赖该端点。
      RNACOS_ENABLE_OPEN_API_AUTH: 'true'
    volumes:
      - rnacos-data:/io
    ports:
      # 可达范围由安全组按来源 IP 收口(见文件头);控制台端口尤其不能对全网开放。
      - '8848:8848'
      - '9848:9848'
      - '10848:10848'
    healthcheck:
      # 镜像是 Debian 基底但无 curl/wget,用 bash 的 /dev/tcp 做纯 TCP 探活
      # (与 app 侧适配器的探活同一思路,且不受 OpenAPI 鉴权开关影响)。
      test:
        [
          'CMD-SHELL',
          "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8848' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # ⚠️ rnacos 的访问日志会把登录请求整条 URL 打进 stdout ——
    # `POST /nacos/v1/auth/login?username=…&password=…`,即控制台口令会出现在容器
    # 日志里(`RNACOS_LOG_LEVEL` 无效,镜像内无日志配置文件)。因此轮转留得比其它
    # 服务紧:口令泄露面已登记在 docs/TODO.md,采集侧过滤是待办的缓解方向。
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── node-exporter(唯一留在主站的监控组件) ────────────────────
  # VictoriaMetrics / Grafana / VictoriaLogs 在监控机那台(见
  # compose.monitoring.yaml):Grafana 查询 VM 是密集链路,若两者分处两机就会让
  # 同一份数据在公网上往返两次。node-exporter 不能走 —— 它必须采集**本机**
  # 宿主机的 /proc、/sys、/,搬到别处就只是在采集那台的指标。
  #
  # 它走 bridge 网络,network 指标只反映容器 netns(已知取舍;CPU/内存/磁盘指标
  # 均来自挂载的宿主机 /proc、/sys、/,不受影响)。
  #
  # 注意:它没有换成 host 网络 —— 换了才能拿到宿主机真实的网络指标,但那是另一个
  # 取舍,与下面 9100 是否发布无关。
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    ports:
      # 监控机的 VictoriaMetrics 要经公网抓它,所以必须发布。
      # ⚠️ 绝不放行 0.0.0.0/0(无内建鉴权):只放行监控机出口 IP(见文件头)。
      - '9100:9100'
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  postgres-data:
  redis-data:
  # RabbitMQ 的持久化(definitions + 消息)。durable queue 的内容落在这里,
  # 备份单位是这个卷。
  rabbitmqdata:
  # victoriametrics-data / grafana-data / victorialogs-data 已随服务搬到
  # compose.monitoring.yaml(监控机),不再属于本文件的卷。
  # neo4j-data / neo4j-logs 已随服务搬到 compose.graph.yaml(图库机)。
  lightrag-data:
  rnacos-data:
  # Mem0 的变更历史(SQLite)。与记忆本体分开:本体在 Postgres 的 pgvector 表里,
  # 这里只是它的 history.db。不挂卷则容器重建即丢历史、首启还会打不开文件。
  mem0-history:
  # RustFS 的对象数据(含版本/元数据)。备份单位是这个卷,不是 bucket ——
  # 见 docs/howto/deploy.md 的存储备份小节。
  rustfs-data:
  # 配置中心 SDK 在 app 容器里的磁盘缓存与日志(冷启动策略依赖前者)。
  nacos-client-cache:
  nacos-client-logs:
