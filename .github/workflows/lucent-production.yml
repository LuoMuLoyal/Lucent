name: lucent-production

on:
  workflow_dispatch:

concurrency:
  group: lucent-production-image
  cancel-in-progress: false

env:
  # 发布者镜像仓库(如 `docker.io/<用户名>/lucent`),经仓库/环境级 secret 注入,
  # 不在公开仓库代码里写死具体用户名;见 docs/reference/deployment.md。
  REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}

jobs:
  build-and-push:
    name: Build & push production image
    runs-on: ubuntu-latest
    environment: production
    if: github.ref_name == 'main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image repository configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "::error::REGISTRY_IMAGE secret is not configured. Set it in GitHub → Settings → Secrets and variables (e.g. docker.io/<your-user>/lucent)." >&2
            exit 1
          fi
          echo "Pushing to ${REGISTRY_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag (short sha)
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # 生产只推不可变的 <sha8> 作为回滚锚点;latest 专供 staging 试验,
      # 生产不推 latest,避免两个环境互相覆盖 latest 造成竞态。
      - name: Build and push Lucent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.image.outputs.image_tag }}
