name: Release

# 发布 **app**（`lucent`）multi-arch 镜像到发布者自有 registry（手动触发）。
#
# 形态：**每架构原生构建** → 各自按 digest 推送 → merge job 合成 multi-arch
# manifest list。不用 QEMU：`ubuntu-24.04-arm` 对公开仓库免费，原生构建既快
# 又避免模拟环境下的工具链行为差异（本项目实测 QEMU 下 `prisma` 会 panic）。
#
# tag 约定：**`sha-<sha8>`**（不含架构）。Docker 拉取时按目标平台自动选层，
# 因此服务器 `.env` 里的 `LUCENT_IMAGE` 换架构不必改 —— 只改 sha。
# 另推 `latest` 指向同一次构建。
#
# **DB 镜像不在这里**：`lucent-db`（PostgreSQL + pgvector + 编译期产出的
# zhparser .so）的构建输入只有 `docker/postgres/**`，实测 40 个提交里只动过
# 一次，而 app 几乎每次发布都要发。两者放同一个 workflow 会让每次 app 发布
# 都白等两个 arm64/amd64 的 DB 构建。它现在在 `release-db.yml`，按需手动触发。
#
# 手工就地构建仍是镜像仓库不可用时的替代路径（见 docs/howto/deploy.md）。

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '发布原因（留档用，不影响构建）'
        required: false
        type: string

concurrency:
  group: lucent-release-image
  cancel-in-progress: false

env:
  # 发布者 registry 里的 app 镜像完整引用（如 `docker.io/<用户名>/lucent`），
  # 经仓库/环境级 secret 注入，不在公开仓库代码里写死具体用户名。
  # 见 docs/reference/deployment.md。
  REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      namespace: ${{ steps.derive.outputs.namespace }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Release must be dispatched from main (got '${{ github.ref_name }}')." >&2
            exit 1
          fi

      # 从 `REGISTRY_IMAGE`（app 镜像完整引用）派生命名空间与 tag。
      # 要求最后一段是 `lucent`，这样派生的 DB 仓库名才是预期的
      # `<namespace>/lucent-db`，而不是靠猜。
      - name: Derive namespace and tag
        id: derive
        shell: bash
        env:
          IMAGE: ${{ secrets.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE}" ]; then
            echo "::error::REGISTRY_IMAGE secret is not configured. Set it in GitHub → Settings → Secrets and variables (e.g. docker.io/<your-user>/lucent)." >&2
            exit 1
          fi
          repo="${IMAGE##*/}"
          namespace="${IMAGE%/*}"
          if [ "${repo}" != "lucent" ]; then
            echo "::error::REGISTRY_IMAGE must end in '/lucent' (got '${IMAGE}')." >&2
            exit 1
          fi
          # namespace 必须真的是「(可选 registry)/属主」，不能只有 registry。
          # `docker.io/lucent` 会让 namespace=`docker.io`，派生出的 DB 镜像变成
          # `docker.io/lucent-db` —— 那是 Docker Hub 官方库的名字，推送必被拒。
          # 首段带 `.`/`:` 即视为 registry 主机，此时必须还有属主段。
          first="${namespace%%/*}"
          case "${first}" in
            *.*|*:*)
              if [ "${namespace}" = "${first}" ]; then
                echo "::error::REGISTRY_IMAGE '${IMAGE}' has a registry ('${first}') but no owner; expected '<registry>/<owner>/lucent'." >&2
                exit 1
              fi
              ;;
          esac
          if [ "${namespace}" = "${IMAGE}" ]; then
            echo "::error::REGISTRY_IMAGE must include a namespace (got '${IMAGE}')." >&2
            exit 1
          fi
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${namespace}/lucent as sha-${GITHUB_SHA::8}"

  build:
    name: Build lucent (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      REGISTRY_NAMESPACE: ${{ needs.validate.outputs.namespace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 原生 runner per arch —— 不走 QEMU。arm64 runner 对公开仓库免费，
          # 本仓库是 public。arm64 层直接给主站（鲲鹏）用。
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只按 digest 推送、不打 tag：多架构 manifest 由 merge job 统一合成。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=lucent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lucent-${{ matrix.arch }}
          # 只按 digest 推送（`outputs` 里的 push 参数负责推送；不再单设
          # `push: true`，二者同时给会冲突）。多架构 manifest 由 merge 合成。
          outputs: type=image,name=${{ env.REGISTRY_NAMESPACE }}/lucent,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/digests/lucent"
          touch "/tmp/digests/lucent/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-lucent-${{ matrix.arch }}
          path: /tmp/digests/lucent/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest (lucent)
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REGISTRY_NAMESPACE: ${{ needs.validate.outputs.namespace }}
      IMAGE_TAG: ${{ needs.validate.outputs.tag }}
      ARCHES: amd64 arm64
    steps:
      # ⚠️ 必须按 `name` 逐个精确下载，**不能**省掉 `name` 去下载全部 artifact：
      #    同一次 run 里 `docker/build-push-action` 还会上传 buildx 缓存
      #    （名为 `<owner>~<repo>~<id>.dockerbuild`，每个 100–260 KB）。
      #    实测下载它们会在重试 5 次后失败 —— 整个 merge job 因此挂掉
      #    （2026-10-05 run 37295603463 的实际故障）。
      #    也不能用 `pattern: digests-lucent-*`：它是 `digests-lucent-db-*`
      #    的前缀，会把 DB 的层混进 app 的 manifest。
      - name: Download digests (amd64)
        uses: actions/download-artifact@v8
        with:
          name: digests-lucent-amd64
          path: /tmp/digests/lucent-amd64

      - name: Download digests (arm64)
        uses: actions/download-artifact@v8
        with:
          name: digests-lucent-arm64
          path: /tmp/digests/lucent-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 用各架构的 digest 合成 manifest list，一次打两个 tag：
      # `sha-<sha8>`（不可变回滚锚点）+ `latest`。
      - name: Create and push manifest list
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          refs=()
          for arch in ${ARCHES}; do
            dir="/tmp/digests/lucent-${arch}"
            if [ ! -d "${dir}" ]; then
              echo "::error::missing digest artifact for lucent ${arch} (${dir})" >&2
              exit 1
            fi
            # `nullglob` 必须有：空目录下 `("${dir}"/*)` 不展开时字面保留 `*`，
            # 会生成 `...@sha256:*` 这种假 reference 并静默推送畸形 manifest。
            digest_files=( "${dir}"/* )
            if [ "${#digest_files[@]}" -ne 1 ]; then
              echo "::error::expected exactly 1 digest in ${dir}, found ${#digest_files[@]}" >&2
              exit 1
            fi
            # digest 文件名就是 `sha256:` 后面的 hex（build job 里 cut 出来的）。
            refs+=( "${REGISTRY_NAMESPACE}/lucent@sha256:$(basename "${digest_files[0]}")" )
          done
          printf 'merging %s arch digest(s) into %s/lucent:%s\n' \
            "${#refs[@]}" "${REGISTRY_NAMESPACE}" "${IMAGE_TAG}"
          printf '  %s\n' "${refs[@]}"
          docker buildx imagetools create \
            -t "${REGISTRY_NAMESPACE}/lucent:${IMAGE_TAG}" \
            -t "${REGISTRY_NAMESPACE}/lucent:latest" \
            "${refs[@]}"

      - name: Inspect the published manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${REGISTRY_NAMESPACE}/lucent:${IMAGE_TAG}"
