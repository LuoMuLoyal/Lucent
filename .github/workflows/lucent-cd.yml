name: lucent-cd

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - lucent-ci
    types:
      - completed

concurrency:
  group: lucent-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'production' }}
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    permissions:
      contents: read
    env:
      REGISTRY_HOST: hkccr.ccs.tencentyun.com
      REGISTRY_NAMESPACE: lucent
      REGISTRY_IMAGE_NAME: lucent
      POSTGRES_IMAGE: postgres:18-alpine
      REDIS_IMAGE: redis:8-alpine
      PROMETHEUS_IMAGE: prom/prometheus:v3.12.0
      GRAFANA_IMAGE: grafana/grafana-oss:13.0.2
      NGINX_IMAGE: nginx:1.29.1-alpine
      SERVER_RELEASES_DIR: /opt/lucent/releases
      SERVER_RUNTIME_DIR: /opt/lucent/runtime
    steps:
      - name: Checkout main ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout workflow-run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(git rev-parse HEAD)"
          image_ref="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${REGISTRY_IMAGE_NAME}:${release_id}"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy assets
        run: node scripts/deploy/validate-deploy-assets.mjs

      - name: Build and push Lucent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.release.outputs.image_ref }}
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.REGISTRY_IMAGE_NAME }}:latest

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare remote release directory
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            release_dir='${SERVER_RELEASES_DIR}/${RELEASE_ID}'
            rm -rf \"\$release_dir\"
            mkdir -p \"\$release_dir/monitoring\" \"\$release_dir/scripts\" \"\$release_dir/deploy\"
            mkdir -p '${SERVER_RELEASES_DIR}' '${SERVER_RUNTIME_DIR}/nginx' '${SERVER_RUNTIME_DIR}/certs'
          "

      - name: Upload deploy assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_RELEASES_DIR}/${RELEASE_ID}/"
          scp -P "$DEPLOY_PORT" -r monitoring "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_RELEASES_DIR}/${RELEASE_ID}/"
          scp -P "$DEPLOY_PORT" -r scripts/deploy "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_RELEASES_DIR}/${RELEASE_ID}/scripts/"
          scp -P "$DEPLOY_PORT" -r deploy/nginx "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_RELEASES_DIR}/${RELEASE_ID}/deploy/"

      - name: Run remote deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            release_dir='${SERVER_RELEASES_DIR}/${RELEASE_ID}'
            chmod +x \"\$release_dir/scripts/deploy/\"*.sh
            export LUCENT_RELEASES_DIR='${SERVER_RELEASES_DIR}'
            export LUCENT_RELEASE_ID='${RELEASE_ID}'
            sh \"\$release_dir/scripts/deploy/sync-deploy-assets.sh\"
            export LUCENT_DEPLOY_DIR='${SERVER_RELEASES_DIR}/current'
            export LUCENT_RUNTIME_DIR='${SERVER_RUNTIME_DIR}'
            export LUCENT_IMAGE='${IMAGE_REF}'
            export POSTGRES_IMAGE='${POSTGRES_IMAGE}'
            export REDIS_IMAGE='${REDIS_IMAGE}'
            export PROMETHEUS_IMAGE='${PROMETHEUS_IMAGE}'
            export GRAFANA_IMAGE='${GRAFANA_IMAGE}'
            export NGINX_IMAGE='${NGINX_IMAGE}'
            sh '${SERVER_RELEASES_DIR}/current/scripts/deploy/deploy-server.sh'
          "
