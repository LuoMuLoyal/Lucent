name: lucent-cd

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - lucent-ci
    types:
      - completed

concurrency:
  group: lucent-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'production' }}
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    permissions:
      contents: read
    env:
      REGISTRY_HOST: hkccr.ccs.tencentyun.com
      REGISTRY_NAMESPACE: lucent
      REGISTRY_IMAGE_NAME: lucent
      SERVER_APP_DIR: /opt/lucent/app
      SERVER_DATA_DIR: /opt/lucent/server
    steps:
      - name: Checkout main ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout workflow-run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$(git rev-parse HEAD)"
          image_ref="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${REGISTRY_IMAGE_NAME}:${image_tag}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy assets
        run: node deploy/validate-assets.ts

      - name: Build and push Lucent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.REGISTRY_IMAGE_NAME }}:latest

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare remote app directory
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            rm -rf '${SERVER_APP_DIR}'
            mkdir -p '${SERVER_APP_DIR}/deploy/nginx'
            mkdir -p '${SERVER_DATA_DIR}/certs' '${SERVER_DATA_DIR}/data/postgres' '${SERVER_DATA_DIR}/data/redis' '${SERVER_DATA_DIR}/logs/app' '${SERVER_DATA_DIR}/logs/nginx'
          "

      - name: Upload deploy assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_APP_DIR}/deploy/"
          scp -P "$DEPLOY_PORT" deploy/deploy-server.ts "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_APP_DIR}/deploy/"
          scp -P "$DEPLOY_PORT" deploy/validate-assets.ts "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_APP_DIR}/deploy/"
          scp -P "$DEPLOY_PORT" deploy/nginx/nginx.conf "$DEPLOY_USER@$DEPLOY_HOST:${SERVER_APP_DIR}/deploy/nginx/"

      - name: Run remote deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            export LUCENT_APP_DIR='${SERVER_APP_DIR}'
            export LUCENT_SERVER_DIR='${SERVER_DATA_DIR}'
            export LUCENT_IMAGE='${IMAGE_REF}'
            node '${SERVER_APP_DIR}/deploy/validate-assets.ts'
            node '${SERVER_APP_DIR}/deploy/deploy-server.ts'
          "
