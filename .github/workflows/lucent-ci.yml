name: lucent-ci

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: lucent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Reusable snippet: setup pnpm + Node + install ──────────────────
# Defined as a composite action inline via anchors (GitHub Actions does not
# support YAML anchors natively, so each job repeats the setup steps).

jobs:
  ci-lint-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # prisma.config.ts requires DATABASE_URL to load; these jobs don't
      # connect to a database, but the postinstall + prisma:generate steps
      # need the variable to pass config validation.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Cache SWC
        uses: actions/cache@v4
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm typecheck

      - name: Type check tools
        run: pnpm typecheck:tools

  ci-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      # prisma.config.ts requires DATABASE_URL to load; this job doesn't
      # connect to a database, but postinstall + prisma:generate need it.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Cache SWC
        uses: actions/cache@v4
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Unit tests
        run: pnpm test:ci

  ci-e2e:
    name: E2E Tests + Build + OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://lucent:lucent_dev@127.0.0.1:5432/lucent?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci_access_secret_min_32_chars_padchars
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_charschars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 14d
      MAIL_DRIVER: log
      MAIL_FROM: noreply@example.com
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci_admin_password
      ADMIN_COOKIE_SECRET: ci_admin_cookie_secret_32chars_plus
      LOG_LEVEL: error
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: lucent
          POSTGRES_PASSWORD: lucent_dev
          POSTGRES_DB: lucent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucent -d lucent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply test migrations
        run: pnpm exec prisma migrate deploy

      # 对比 base 分支与本 PR 的 schema，检测破坏性 migration（DROP/TRUNCATE/
      # 改列类型），只打警告不阻断——用于评估停机窗口时长与回滚风险
      # （单 slot 部署下回滚不回退 schema，见 docs/reference/deployment.md）。
      - name: Destructive migration check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:prisma/schema.prisma" > /tmp/base-schema.prisma
          pnpm exec prisma migrate diff \
            --from-schema-datamodel /tmp/base-schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/migration-diff.sql
          if grep -nE 'DROP TABLE|DROP COLUMN|TRUNCATE|SET DATA TYPE' /tmp/migration-diff.sql; then
            echo "::warning file=prisma/schema.prisma::本次变更含破坏性 migration（DROP/TRUNCATE/改列类型）。请评估停机窗口时长；注意回滚只回应用版本、不回退 schema。"
          else
            echo "No destructive migration detected."
          fi

      - name: Cache SWC
        uses: actions/cache@v4
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Build
        run: pnpm build

      # OpenAPI spec must be generated before E2E tests — the contract test
      # suite (test/contract/) loads docs/reference/generated/openapi.json at startup. The file is
      # tracked in git, but re-export here to ensure it matches the current code.
      # Reuses the dist/ from the previous Build step — no redundant recompilation.
      - name: Export OpenAPI spec
        run: pnpm openapi:export

      - name: E2E tests
        run: pnpm test:e2e:ci

  docker:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: lucent-ci:scan

      # 宽松模式：扫描并输出 HIGH/CRITICAL 漏洞报告，但不阻断 CI。
      # 待基线建立后再考虑收紧为 exit-code: 1 或加 .trivyignore 白名单。
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lucent-ci:scan
          severity: HIGH,CRITICAL
          exit-code: '0'
