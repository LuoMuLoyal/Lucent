name: lucent-staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - lucent-ci
    types:
      - completed

concurrency:
  group: lucent-staging-image
  cancel-in-progress: false

env:
  # 发布者镜像仓库(如 `docker.io/<用户名>/lucent`),经仓库/环境级 secret 注入,
  # 不在公开仓库代码里写死具体用户名;见 docs/reference/deployment.md。
  REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}

jobs:
  build-and-push:
    name: Build & push staging image
    runs-on: ubuntu-latest
    environment: staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    permissions:
      contents: read
    steps:
      - name: Checkout main ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout workflow-run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate image repository configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "::error::REGISTRY_IMAGE secret is not configured. Set it in GitHub → Settings → Secrets and variables (e.g. docker.io/<your-user>/lucent)." >&2
            exit 1
          fi
          echo "Pushing to ${REGISTRY_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag (short sha)
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push Lucent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.image.outputs.image_tag }}
            ${{ env.REGISTRY_IMAGE }}:latest

      # CI 通过后自动部署 staging:调 Coolify 部署 webhook(Application 资源)。
      # webhook URL 完整存放在 GitHub secret `COOLIFY_STAGING_WEBHOOK`,格式:
      #   https://<coolify>/api/v1/deploy?uuid=<app-uuid>&force=false
      # force=false 时 Coolify 会跳过与当前运行镜像相同的部署;
      # 需要强制重建时把 secret 里的 force 改成 true。
      # 注意:webhook 是 Application 专属,Coolify 侧须把 staging 注册为
      # Application(Dockerfile build pack),而非 Docker Compose Service。
      - name: Trigger Coolify staging deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_STAGING_WEBHOOK" ]; then
            echo "::warning::COOLIFY_STAGING_WEBHOOK secret not configured — skipped automatic deployment to Coolify staging."
            exit 0
          fi
          curl -fsS -X POST "$COOLIFY_STAGING_WEBHOOK"
        env:
          COOLIFY_STAGING_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
