name: lucent-staging

# staging 部署:push 到 main 立即发布(不等 lucent-ci 结果、无人工批准)。
# 应用是宿主原生 PM2 进程,本工作流只做一件事:SSH 到服务器跑发布命令串。
# 模型与排障见 docs/reference/deployment.md,手动发布的同一串命令见 docs/howto/deploy.md。

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时间只允许一次发布(排队而非取消):两次发布并发会互相覆盖工作区。
concurrency:
  group: lucent-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging (SSH + PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment 只用于取 secrets/variables(未配置 required reviewers)
    environment: staging
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error::STAGING_SSH_KEY secret is not configured." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::STAGING_SSH_HOST / STAGING_SSH_USER secrets are not configured." >&2
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/staging_key -p "$PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/lucent
          cd "$APP_DIR"

          # 环境文件缺失时先退出,不要白停一次服
          test -f .env.production || { echo "[deploy] missing $APP_DIR/.env.production" >&2; exit 1; }

          echo "[deploy] stopping lucent"
          pm2 stop lucent || true

          echo "[deploy] syncing origin/main"
          git fetch --prune origin
          git reset --hard origin/main
          git --no-pager log --oneline -1

          echo "[deploy] installing dependencies"
          pnpm install --frozen-lockfile

          echo "[deploy] generating prisma client + building"
          pnpm prisma:generate
          pnpm build

          echo "[deploy] applying database migrations"
          NODE_ENV=production pnpm exec prisma migrate deploy

          echo "[deploy] starting lucent"
          pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          pm2 save

          echo "[deploy] health gate (local /api/v1/health/ready)"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "[deploy] health gate failed — last 100 log lines:" >&2
            pm2 logs lucent --lines 100 --nostream || true
            exit 1
          fi

          pm2 status
          echo "[deploy] done"
          REMOTE

      - name: Public health check
        if: ${{ vars.STAGING_API_HOST != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 \
            "https://${{ vars.STAGING_API_HOST }}/api/v1/health/deep"
