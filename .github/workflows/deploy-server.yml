name: lucent-ci-cd

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: lucent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HUSKY: 0
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://lucent:lucent_dev@127.0.0.1:5432/lucent?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 14d
      MAIL_DRIVER: log
      MAIL_FROM: noreply@example.com
      LOG_LEVEL: error
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lucent
          POSTGRES_PASSWORD: lucent_dev
          POSTGRES_DB: lucent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucent -d lucent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply test migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm lint:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:ci

      - name: E2E tests
        run: pnpm test:e2e:ci

  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
      REGISTRY_IMAGE_NAME: ${{ vars.REGISTRY_IMAGE_NAME }}
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      postgres_image_ref: ${{ steps.meta.outputs.postgres_image_ref }}
      redis_image_ref: ${{ steps.meta.outputs.redis_image_ref }}
      registry_host: ${{ steps.meta.outputs.registry_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          registry_host="${REGISTRY_HOST:-ghcr.io}"
          default_namespace="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          default_image_name="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          namespace="${REGISTRY_NAMESPACE:-$default_namespace}"
          image_name="${REGISTRY_IMAGE_NAME:-$default_image_name}"
          image_repo="${registry_host}/${namespace}/${image_name}"
          image_ref="${image_repo}:sha-${GITHUB_SHA}"
          postgres_image_repo="${registry_host}/${namespace}/${image_name}-postgres"
          postgres_image_ref="${postgres_image_repo}:18-alpine"
          redis_image_repo="${registry_host}/${namespace}/${image_name}-redis"
          redis_image_ref="${redis_image_repo}:8-alpine"

          {
            echo "registry_host=${registry_host}"
            echo "image_repo=${image_repo}"
            echo "image_ref=${image_ref}"
            echo "postgres_image_repo=${postgres_image_repo}"
            echo "postgres_image_ref=${postgres_image_ref}"
            echo "redis_image_repo=${redis_image_repo}"
            echo "redis_image_ref=${redis_image_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
      LUCENT_IMAGE: ${{ needs.docker.outputs.image_ref }}
      POSTGRES_IMAGE: ${{ needs.docker.outputs.postgres_image_ref }}
      REDIS_IMAGE: ${{ needs.docker.outputs.redis_image_ref }}
      REGISTRY_HOST: ${{ needs.docker.outputs.registry_host }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync deployment files to server
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_APP_DIR"

          ssh -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p '$SERVER_APP_DIR/scripts/deploy'"

          tar czf - docker-compose.yml scripts/deploy/deploy-server.sh | \
            ssh -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "tar xzf - -C '$SERVER_APP_DIR'"

          ssh -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "chmod +x '$SERVER_APP_DIR/scripts/deploy/deploy-server.sh'"

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          password_b64="$(printf '%s' "$REGISTRY_PASSWORD" | base64 -w0)"
          printf -v remote_env 'SERVER_APP_DIR=%q LUCENT_IMAGE=%q POSTGRES_IMAGE=%q REDIS_IMAGE=%q REGISTRY_HOST=%q REGISTRY_USERNAME=%q REGISTRY_PASSWORD_B64=%q' \
            "$SERVER_APP_DIR" \
            "$LUCENT_IMAGE" \
            "$POSTGRES_IMAGE" \
            "$REDIS_IMAGE" \
            "$REGISTRY_HOST" \
            "$REGISTRY_USERNAME" \
            "$password_b64"

          ssh -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "$remote_env sh -s" <<'EOF'
          set -eu
          export REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d)"
          cd "$SERVER_APP_DIR"
          sh scripts/deploy/deploy-server.sh
          EOF
