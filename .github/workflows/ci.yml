name: CI

# 代码门禁：lint / typecheck / 单测 / e2e + OpenAPI 契约。
# 镜像构建与漏洞扫描在 docker.yml；发布在 release.yml；文档门禁在 docs.yml。
# 拆分理由见 .github/workflows/README.md。

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: lucent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # prisma.config.ts requires DATABASE_URL to load; these jobs don't
      # connect to a database, but the postinstall + prisma:generate steps
      # need the variable to pass config validation.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Cache SWC
        uses: actions/cache@v6
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm typecheck

      - name: Type check tools
        run: pnpm typecheck:tools

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      # prisma.config.ts requires DATABASE_URL to load; this job doesn't
      # connect to a database, but postinstall + prisma:generate need it.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Cache SWC
        uses: actions/cache@v6
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Unit tests
        run: pnpm test:ci

  e2e:
    name: E2E Tests + Build + OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3000
      # The e2e suite asserts CORS behavior for the Origins it sends, so the
      # allowlist must cover them: the assistant SSE spec uses
      # http://localhost:9100 and the CORS-preflight guard uses
      # https://web.example.com.
      CORS_ORIGIN: http://127.0.0.1:3000,http://localhost:9100,https://web.example.com
      DATABASE_URL: postgresql://lucent:lucent_dev@127.0.0.1:5432/lucent?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci_access_secret_min_32_chars_padchars
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_charschars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 14d
      MAIL_DRIVER: log
      MAIL_FROM: noreply@example.com
      # Required by the testing-support suite: TestingSharedSecretGuard
      # forbids every request when this is unset (`.env.test` is not tracked,
      # so the workflow env block is the only source in CI).
      TESTING_SHARED_SECRET: e2e-test-shared-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci_admin_password
      ADMIN_COOKIE_SECRET: ci_admin_cookie_secret_32chars_plus
      LOG_LEVEL: error
      # E2E tests set x-forwarded-for to simulate distinct clients (see
      # uniqueClientIp in test/e2e/auth/auth.e2e-spec.ts); without trustProxy the
      # verification-code client rate limit buckets every request under the same
      # 127.0.0.1 key and the suites exhaust the limit (429). .env.test.example
      # ships TRUST_PROXY=true for the same reason.
      TRUST_PROXY: 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: lucent
          POSTGRES_PASSWORD: lucent_dev
          POSTGRES_DB: lucent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucent -d lucent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from package.json#packageManager (pnpm@12.0.0)
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply test migrations
        run: pnpm exec prisma migrate deploy

      - name: Cache SWC
        uses: actions/cache@v6
        with:
          path: .swc
          key: swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            swc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            swc-${{ runner.os }}-

      - name: Build
        run: pnpm build

      # OpenAPI spec must be generated before E2E tests — the contract test
      # suite (test/contract/) loads docs/reference/generated/openapi.json at
      # startup. The file is tracked in git, but re-export here to ensure it
      # matches the current code. Reuses the dist/ from the previous Build
      # step — no redundant recompilation.
      - name: Export OpenAPI spec
        run: pnpm openapi:export

      - name: E2E tests
        run: pnpm test:e2e:ci
