version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      langchain:
        patterns:
          - '@langchain/*'
          - 'langchain'
      dev-tools:
        patterns:
          - 'eslint*'
          - 'prettier'
          - '@types/*'
          - 'jest'
          - 'ts-jest'
          - 'typescript'
          - '@swc/*'
    ignore:
      # Node.js engine is pinned to 24.x; ignore major bumps until verified
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
