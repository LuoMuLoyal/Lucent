global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lucent'
    metrics_path: /metrics
    basic_auth:
      username: ${METRICS_USER}
      password: ${METRICS_PASSWORD}
    static_configs:
      - targets: ['app-blue:3000', 'app-green:3000']
        labels:
          service: 'lucent-backend'
