# Lucent Prometheus 配置模板
# 注意：本文件是【模板】。prometheus 原生不支持配置内环境变量插值，
# 由宿主机 deploy/render-configs.sh 把 ${METRICS_USER}/${METRICS_PASSWORD}
# 渲染为 prometheus/.rendered/prometheus.yml 后挂载使用。
# 直接给 prometheus 使用本文件会把 ${...} 当字面量，basic_auth 会静默失效。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        # alertmanager 服务带 profile（未启用时不存在），此时 prometheus
        # 只会报 DNS 解析失败日志，规则照常评估，不影响指标采集。
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'lucent'
    metrics_path: /metrics
    basic_auth:
      username: ${METRICS_USER}
      password: ${METRICS_PASSWORD}
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'lucent-backend'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'lucent-postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'lucent-redis'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'lucent-host'
