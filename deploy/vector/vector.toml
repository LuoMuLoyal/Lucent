# Vector 日志采集配置
#
# 采集 app 容器的 stdout JSON 日志（Docker json-file 驱动），
# 解析 JSON 后推送到 VictoriaLogs HTTP ingest 端点。
#
# 挂载路径：/var/lib/docker/containers（宿主机 Docker 日志目录）
# VictoriaLogs ingest URL：http://victorialogs:9428/insert/jsonline

data_dir = "/var/lib/vector"

# ── Sources：读取 app 容器日志 ──────────────────────────────
[sources.docker_app_logs]
type = "docker_logs"
# 只采集 lucent-app 容器的日志（按容器名过滤）
include_containers = ["lucent-app"]
# 自动换行处理 JSON 多行
auto_partial_merge = true

# ── Transforms：解析 JSON 日志行 ────────────────────────────
[transforms.parse_json]
type = "remap"
inputs = ["docker_app_logs"]
source = '''
# Docker 日志的 message 字段是 Winston 输出的 JSON 字符串
parsed = parse_json(.message) ?? {}
. = merge(., parsed)
# 设置 _msg_name 为日志的 message 字段（VictoriaLogs 的主消息字段）
._msg_name = .message
# 确保 level 字段作为日志级别
._stream_fields.level = .level
._stream_fields.context = .context
'''

# ── Sinks：推送到 VictoriaLogs ─────────────────────────────
[sinks.victorialogs]
type = "http"
inputs = ["parse_json"]
# VictoriaLogs JSON insert API
uri = "http://victorialogs:9428/insert/jsonline"
method = "post"
# 每行一个 JSON 对象（JSON Lines 格式）
framing.method = "newline_delimited"
encoding.codec = "json"
# 压缩
compression = "gzip"
# 批量发送
batch.max_events = 100
batch.timeout_secs = 1
# 重试
request.retry_attempts = 3
request.retry_initial_backoff_secs = 1
request.retry_max_duration_secs = 30
# 超时
request.timeout_secs = 10
