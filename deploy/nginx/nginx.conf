worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # ── Rate / connection limiting (tune as needed) ───────────────
  limit_req_zone $binary_remote_addr zone=lucent_api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=lucent_conn:10m;

  # ── Gzip ──────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;

  # ── Security headers ──────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── SSL optimization ──────────────────────────────────────────
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # ── Upstream: single app slot ─────────────────────────────────
  # nginx resolves `app` to a container IP when this config is loaded and
  # caches it. deploy.ts reloads nginx after every app container recreate
  # so the upstream IP is re-resolved (otherwise requests would 502).
  upstream lucent_app {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /nginx-health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location /nginx-health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ── Block /metrics from external access ────────────────────
    # Prometheus scrapes the app container directly on the internal Docker
    # network (app:3000), not through Nginx.
    # /metrics is blocked here as defense-in-depth; the Express-level
    # Basic Auth provides additional protection when Nginx is bypassed.
    location = /metrics {
      return 403;
    }

    # ── SSE endpoints: disable buffering ────────────────────────
    # Long-lived streams: limit concurrent connections per IP but do NOT
    # apply limit_req — a request-rate limit would kill open streams.
    location ~ ^/api/v1/.*\/stream$ {
      limit_conn lucent_conn 50;
      proxy_pass http://lucent_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      limit_req zone=lucent_api burst=40 nodelay;
      limit_conn lucent_conn 50;
      proxy_pass http://lucent_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
