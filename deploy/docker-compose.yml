services:
  postgres:
    image: postgres:18-alpine
    container_name: lucent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucent
      POSTGRES_PASSWORD: lucent_dev
      POSTGRES_DB: lucent
    ports:
      - '5432:5432'
    volumes:
      - ${LUCENT_SERVER_DIR}/data/postgresql:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lucent']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: lucent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ${LUCENT_SERVER_DIR}/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${LUCENT_IMAGE:?LUCENT_IMAGE is required}
    container_name: lucent-app
    restart: unless-stopped
    env_file:
      - ${LUCENT_SERVER_DIR}/.env.production
    environment:
      DATABASE_URL: postgresql://lucent:lucent_dev@postgres:5432/lucent?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ${LUCENT_SERVER_DIR}/logs/app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.29.1-alpine
    container_name: lucent-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LUCENT_SERVER_DIR}/certs:/etc/nginx/certs:ro
      - ${LUCENT_SERVER_DIR}/logs/nginx:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: lucent-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${LUCENT_SERVER_DIR}/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.listen-address=0.0.0.0:9090'
    ports:
      - '9090:9090'
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    container_name: lucent-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/opt/grafana/dashboards:ro
      - ${LUCENT_SERVER_DIR}/data/grafana:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      prometheus:
        condition: service_started
