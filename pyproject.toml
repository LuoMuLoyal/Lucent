[project]
name = "semantica-service"
version = "0.1.0"
description = "OAG sidecar for the English DrugBank graph"
readme = "README.md"
authors = [
    { name = "Luo", email = "2508015296@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # The rule library is YAML so rules can be reviewed as data rather than as
    # request parameters. Parsed with safe_load only: a rule file is
    # configuration, never code.
    "pyyaml>=6.0",
    # semantica is installed from the fork's main branch, not PyPI: the
    # released 0.6.8 lags main by 127 commits and predates every fork fix.
    # extras are curated rather than [all] — [all] also pulls dev, infra,
    # cloud and graph-all. The `explorer` extra is still deliberately absent:
    # its routes are a development console, not our tool contract, and the
    # service never mounts them. Visualization runs as a separate process
    # against an export (scripts/export_context_graph.py), which needs only
    # the dependency below.
    "semantica[shacl,graph-apache-age,tripletstore-oxigraph]",
    # Required to import semantica.explorer at all: its export/import route
    # declares a Form parameter, and FastAPI refuses to define the route
    # without it. It ships in the `explorer` extra, which is not installed,
    # so it is declared directly rather than pulling the whole extra in.
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psycopg2>=2.9.21.20260911",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
semantica = { git = "ssh://git@github.com/LuoMuLoyal/semantica.git", branch = "main" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "T20"]

# Operator scripts report through stdout — that IS their interface, so the
# print ban applies to the service and tests only. Test doubles must keep the
# real store's signature (`execute_query(self, query, parameters=None)`) to stay
# substitutable, which leaves those arguments unused by design.
# The verification-report generator embeds Chinese prose in markdown literals,
# where wrapping is governed by the document rather than by line length.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["ARG002"]
"scripts/write_verification_scale.py" = ["T201", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

# semantica ships neither a py.typed marker nor stubs, so its types are
# unavailable. Scoped to that one package: our own code stays under strict.
[[tool.mypy.overrides]]
module = ["semantica.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
